# Qory Apiary and its Postgres, from the image a release publishes. Put .env beside this
# file (from .env.example), then: docker compose up -d
# To upgrade: set APIARY_VERSION in .env, then: docker compose pull && docker compose up -d
name: qory

x-apiary-image: &apiary-image
  ${APIARY_IMAGE:-ghcr.io/qoryai/apiary}:${APIARY_VERSION:?set APIARY_VERSION in .env}

services:
  # Runs once at every start and exits: gives the volume keys, and each folder and file in
  # it, to Qory Apiary's user 65532 before keys runs. Earlier images ran as nobody and
  # left the volume to 65534. Without CAP_DAC_READ_SEARCH, root cannot read a folder that
  # another user owns with mode 0700, so find first gives each folder to root, parent
  # before child, and chown then gives everything to 65532. Neither follows a symbolic
  # link: find tests each entry without following it, and chown -P -h changes a link, not
  # its target.
  keys-owner:
    image: *apiary-image
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER]
    security_opt: ["no-new-privileges:true"]
    entrypoint: ["/bin/sh", "-c", 'find /var/lib/apiary/keys -type d -exec chown -h 0:0 {} \; && chown -R -P -h 65532:65532 /var/lib/apiary/keys']
    network_mode: none
    volumes:
      - keys:/var/lib/apiary/keys
    restart: "no"

  # Runs once at every start and exits: generates the keys the volume does not hold yet,
  # and never changes one it holds.
  keys:
    image: *apiary-image
    command: ["/app/bin/keys"]
    depends_on:
      keys-owner:
        condition: service_completed_successfully
    env_file: .env
    volumes:
      - keys:/var/lib/apiary/keys
    restart: "no"

  # The bundled Postgres, in the profile `postgres` that .env turns on.
  postgres:
    image: postgres:18
    profiles: [postgres]
    restart: unless-stopped
    depends_on:
      keys:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: apiary
      POSTGRES_DB: apiary
      POSTGRES_PASSWORD_FILE: /run/apiary-keys/postgres-password
    volumes:
      # postgres:18 keeps its data under /var/lib/postgresql/<major>; mount the parent.
      - postgres-data:/var/lib/postgresql
      - keys:/run/apiary-keys:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apiary -d apiary"]
      interval: 5s
      timeout: 5s
      retries: 12

  apiary:
    image: *apiary-image
    restart: unless-stopped
    init: true
    depends_on:
      keys:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
        required: false
    env_file: .env
    environment:
      # The bundled Postgres, unless .env names another; its password is in the volume `keys`.
      DATABASE_URL: ${DATABASE_URL:-postgres://apiary@postgres/apiary}
      # The adapters installed with Qory Apiary, from .env; none unless .env names them.
      QORY_INSTALLED_ADAPTERS: ${QORY_INSTALLED_ADAPTERS:-}
    # Qory Apiary calls the github adapter at github.<host of PUBLIC_URL>, through the
    # reverse proxy on this machine. Set PUBLIC_HOST in .env to the host of PUBLIC_URL.
    # Never set it to localhost: the mapping would give localhost inside the container a
    # second address, this machine's.
    # Another adapter needs a line of the same form under extra_hosts:
    #   - "<adapter name>.${PUBLIC_HOST:-public-host.invalid}:host-gateway"
    # The host of PUBLIC_URL is mapped too, so a request from the container to PUBLIC_URL
    # reaches the reverse proxy here, not the public address, which a machine behind NAT
    # often cannot reach from inside.
    extra_hosts:
      - "${PUBLIC_HOST:-public-host.invalid}:host-gateway"
      - "github.${PUBLIC_HOST:-public-host.invalid}:host-gateway"
    volumes:
      - keys:/var/lib/apiary/keys:ro
      # The one-time code Qory Apiary writes for the GitHub adapter, in memory. Besides
      # Qory Apiary, only that adapter mounts this folder, read-only.
      - type: volume
        source: github-enrolment
        target: /run/qory/enrolment/github
        volume:
          nocopy: true
    ports:
      # To the reverse proxy on this machine only. compose.override.yaml changes it.
      - "127.0.0.1:4100:4100"
      # The GitHub adapter's port: the adapter shares the network of the service `apiary`,
      # so its port is published here. Nothing answers on it while the profile `github`
      # is off.
      - "127.0.0.1:${QORY_GITHUB_HOST_PORT:-8080}:8080"

  # The GitHub adapter, installed with Qory Apiary, in the profile `github`. To turn it
  # on, add github to COMPOSE_PROFILES in .env, and set there an https PUBLIC_URL,
  # QORY_INSTALLED_ADAPTERS=github, factory in QORY_FEATURES, and QORY_GITHUB_PUBLIC_URL.
  # The adapter needs a separate public name, which the reverse proxy routes by host name
  # to 127.0.0.1 on QORY_GITHUB_HOST_PORT (8080 unless set). Keep the query strings of
  # /setup out of the proxy's access logs.
  # Turning the profile off removes nothing from Qory Apiary. To remove the adapter, take
  # github off QORY_INSTALLED_ADAPTERS, then remove it under Instance settings › Adapters.
  github:
    image: ${QORY_GITHUB_IMAGE:-ghcr.io/qoryai/qory-github-server}
    profiles: [github]
    command: ["serve"]
    restart: unless-stopped
    depends_on:
      apiary:
        condition: service_started
    network_mode: "service:apiary"
    environment:
      QORY_GITHUB_LISTEN: ":8080"
      QORY_GITHUB_STATE_DIR: /var/lib/qory-github
      QORY_GITHUB_PUBLIC_URL: ${QORY_GITHUB_PUBLIC_URL:-}
      QORY_GITHUB_APIARY_URL: http://127.0.0.1:4100
      QORY_GITHUB_APIARY_PUBLIC_URL: ${PUBLIC_URL:-}
      QORY_GITHUB_ENROLMENT_CODE_FILE: /run/qory/enrolment/code
    volumes:
      - type: volume
        source: github-enrolment
        target: /run/qory/enrolment
        read_only: true
        volume:
          nocopy: true
      # A directory on the host in place of the volume `github-state` must belong to the
      # adapter's user: chown 65532:65532 DIR && chmod 0700 DIR.
      - github-state:/var/lib/qory-github

volumes:
  postgres-data:
  keys:
  # The GitHub adapter's one-time code, in memory, in a folder of uid 65532, mode 0700:
  # Qory Apiary and the adapter both run as that user, and the file is mode 0400. A stop
  # of both apiary and github loses it; while the adapter has no key in use, Qory Apiary
  # writes a new one.
  github-enrolment:
    driver_opts: {type: tmpfs, device: tmpfs, o: "uid=65532,gid=65532,mode=0700,size=64k"}
  github-state:
