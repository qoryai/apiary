# Qory Apiary on AWS: one Fargate task behind an Application Load Balancer, RDS for
# PostgreSQL, and the secrets Qory makes at first start kept in Secrets Manager.
#
# A release names its version: scripts/aws-template-release.py writes it into the Release
# mapping and into the texts that name it. Here, in the repository, the mapping is empty,
# so an upload by hand types the version under Version, or, for a test before a release,
# names an image under Test image.
#
# Upgrade with the console's Update and the new release's template, or with
# `aws cloudformation deploy`, which keep the parameters they are not given. KeysFromStack
# and DatabaseSnapshot keep their values for the life of the stack: an update that drops
# DatabaseSnapshot replaces the restored database with an empty one. The stack sets its own
# stack policy once, at creation (StackPolicy, below), the policy of
# deploy/aws/stack-policy.json in the repository: it refuses any update that would replace
# or delete the database or a key's secret.
AWSTemplateFormatVersion: "2010-09-09"
Description: Qory Apiary on ECS Fargate, with RDS for PostgreSQL, an Application Load Balancer and Secrets Manager.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: Edition }
        Parameters: [Edition, ProDownloadKey]
      - Label: { default: Address }
        Parameters: [DomainName, HostedZoneId, CertificateArn]
      - Label: { default: Version }
        Parameters: [VersionOverride]
      - Label: { default: Size }
        Parameters: [DatabaseInstanceClass, CpuArchitecture]
      - Label: { default: Restore }
        Parameters: [KeysFromStack, DatabaseSnapshot]
      - Label: { default: Recovery }
        Parameters: [AcceptSigningKey, DatabaseDeletionProtection]
      - Label: { default: For testing only }
        Parameters: [TestImage]
    ParameterLabels:
      Edition: { default: Edition }
      ProDownloadKey: { default: Apiary Pro download key }
      DomainName: { default: Domain name }
      HostedZoneId: { default: Route 53 hosted zone (recommended) }
      CertificateArn: { default: Your own ACM certificate (optional) }
      VersionOverride: { default: Version }
      DatabaseInstanceClass: { default: Database instance class }
      CpuArchitecture: { default: CPU architecture }
      KeysFromStack: { default: Keys of a deleted stack (optional) }
      DatabaseSnapshot: { default: Database snapshot to restore (optional) }
      AcceptSigningKey: { default: Accept a new signing key (fingerprint) }
      DatabaseDeletionProtection: { default: Protect the database from deletion }
      TestImage: { default: Test image (leave empty) }

Parameters:
  Edition:
    Type: String
    Default: Apiary Community
    AllowedValues: [Apiary Community, Apiary Pro]
    Description: "Apiary Community is free and open source. Apiary Pro needs the download key we sent you. Apiary Community → Apiary Pro is possible later; the way back is not."
  # <account>:<token>, split on its one colon into the registry's user name and password.
  ProDownloadKey:
    Type: String
    Default: ""
    NoEcho: true
    AllowedPattern: '^$|^[A-Za-z0-9-]+:[^\s"\\:]+$'
    ConstraintDescription: "The download key as we sent it: an account name, a colon and a token."
    Description: "Only for Apiary Pro: the download key we sent you. Leave empty for Apiary Community. A revoked or expired key stops the running instance at its next task replacement. Also needed to pull a test image."
  DomainName:
    Type: String
    MinLength: 1
    Description: For example qory.example.com.
  HostedZoneId:
    Type: String
    Default: ""
    Description: "A Route 53 hosted zone for the domain: the stack makes the certificate and the record. Without one, add two records at your DNS provider: the certificate's validation record, which the stack's Events show while it waits, and a CNAME to the LoadBalancerDnsName output."
  CertificateArn:
    Type: String
    Default: ""
    Description: "An ACM certificate for the domain, in this region. Empty: the stack makes one."
  VersionOverride:
    Type: String
    Default: ""
    Description: "This copy of the template names no release: type the version to install, such as 0.2.0. Ignored when a test image is set."
  DatabaseInstanceClass:
    Type: String
    Default: db.t4g.micro
  CpuArchitecture:
    Type: String
    Default: X86_64
    AllowedValues: [X86_64, ARM64]
  KeysFromStack:
    Type: String
    Default: ""
    Description: "The name a deleted stack's kept key secrets start with, the part before /secret-key-base, such as qory-0a1b2c3d-4e5f-11f0-8a9b-0c1d2e3f4a5b: this stack uses those secrets instead of generating new ones. Keep it as it was on every later update."
  DatabaseSnapshot:
    Type: String
    Default: ""
    Description: A snapshot to restore the database from, such as a deleted stack's final snapshot. Keep it as it was on every later update.
  AcceptSigningKey:
    Type: String
    Default: ""
    Description: "Leave empty. Only when the log says the signing key is not the one the machines pinned: paste the fingerprint it names, then Update."
  DatabaseDeletionProtection:
    Type: String
    Default: "Yes"
    AllowedValues: ["Yes", "No"]
    Description: "Yes turns it on once Qory first starts healthy, so a failed install still rolls back. To delete the stack, Update with No first, then Delete. With No, the database's final snapshot is kept when the stack is deleted."
  # A pre-release image, such as ghcr.io/qoryai/apiary-prerelease:sha-<7>, which
  # .github/workflows/prerelease.yml publishes. It replaces the Edition's image and version,
  # and is pulled with the download key, whatever the Edition (TestImageNeedsDownloadKey).
  TestImage:
    Type: String
    Default: ""
    Description: "Leave empty. Only for Qory's pre-release tests: a full image reference, which replaces the image the Edition picks. Needs the download key above."

# The versions a release names, which scripts/aws-template-release.py writes in. Empty
# here, in the repository. The images are each edition's.
Mappings:
  Release:
    Versions:
      CommunityVersion: ""
      ProVersion: ""
  Images:
    Community:
      Repository: ghcr.io/qoryai/apiary
    Pro:
      Repository: ghcr.io/qoryai/apiary-pro

Rules:
  # A restored database keeps the snapshot's password and holds what the old keys
  # encrypted: with new keys no task boots.
  KeysWithDatabaseSnapshot:
    RuleCondition: !Not [!Equals [!Ref DatabaseSnapshot, ""]]
    Assertions:
      - Assert: !Not [!Equals [!Ref KeysFromStack, ""]]
        AssertDescription: "A database snapshot needs the keys of the stack it came from: set Keys of a deleted stack."
  ProNeedsDownloadKey:
    RuleCondition: !Equals [!Ref Edition, Apiary Pro]
    Assertions:
      - Assert: !Not [!Equals [!Ref ProDownloadKey, ""]]
        AssertDescription: Apiary Pro needs its download key.
  # Apiary Pro's image is built for linux/amd64 alone.
  ProOnX86:
    RuleCondition: !Equals [!Ref Edition, Apiary Pro]
    Assertions:
      - Assert: !Equals [!Ref CpuArchitecture, X86_64]
        AssertDescription: Apiary Pro runs on X86_64 only.
  # A test image is pulled from a private package, with the download key.
  TestImageNeedsDownloadKey:
    RuleCondition: !Not [!Equals [!Ref TestImage, ""]]
    Assertions:
      - Assert: !Not [!Equals [!Ref ProDownloadKey, ""]]
        AssertDescription: "A test image needs the download key: set Apiary Pro download key."
  # With Version empty, the edition's version is the Release mapping's. A Rule cannot read a
  # mapping, so the release writes the same version in here too
  # (scripts/aws-template-release.py), as the value each Assert compares Version with: Version
  # being empty here, the Assert holds exactly when that value is not. Here, in the
  # repository, both are empty. With a test image the image names its own version, so
  # neither Rule applies; the download key and the CPU architecture are still checked above.
  CommunityVersionNamed:
    RuleCondition: !And
      - !Equals [!Ref Edition, Apiary Community]
      - !Equals [!Ref VersionOverride, ""]
      - !Equals [!Ref TestImage, ""]
    Assertions:
      - Assert: !Not [!Equals [!Ref VersionOverride, ""]]
        AssertDescription: "This copy of the template names no release of Apiary Community: type a version under Version."
  ProVersionNamed:
    RuleCondition: !And
      - !Equals [!Ref Edition, Apiary Pro]
      - !Equals [!Ref VersionOverride, ""]
      - !Equals [!Ref TestImage, ""]
    Assertions:
      - Assert: !Not [!Equals [!Ref VersionOverride, ""]]
        AssertDescription: Apiary Pro is installed from Apiary Pro's release.

Conditions:
  IsPro: !Equals [!Ref Edition, Apiary Pro]
  HasVersionOverride: !Not [!Equals [!Ref VersionOverride, ""]]
  HasTestImage: !Not [!Equals [!Ref TestImage, ""]]
  # A key given with Apiary Community is used for the pull too.
  HasDownloadKey: !Not [!Equals [!Ref ProDownloadKey, ""]]
  HasAcceptSigningKey: !Not [!Equals [!Ref AcceptSigningKey, ""]]
  ProtectDatabase: !Equals [!Ref DatabaseDeletionProtection, "Yes"]
  HasHostedZone: !Not [!Equals [!Ref HostedZoneId, ""]]
  CreateCertificate: !Equals [!Ref CertificateArn, ""]
  # With KeysFromStack, the stack makes no secret: it reads the ones the named stack kept.
  CreateSecrets: !Equals [!Ref KeysFromStack, ""]
  RestoreDatabase: !Not [!Equals [!Ref DatabaseSnapshot, ""]]

Resources:
  # The network: two zones, the load balancer and the task in public subnets, the database
  # in isolated ones (the VPC's main route table, with no route out). No NAT gateway: the
  # task has a public address and admits only the load balancer.
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.0.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  IsolatedSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.10.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]

  IsolatedSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.11.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]

  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Qory Apiary load balancer
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIpv6: "::/0" }
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIpv6: "::/0" }

  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Qory Apiary task
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 4100
          ToPort: 4100
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Qory Apiary database
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref TaskSecurityGroup

  # The load balancer. The idle timeout keeps the console's WebSockets open; /health is
  # plain HTTP on 4100 and answers once migrations have run.
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: application
      Scheme: internet-facing
      Subnets: [!Ref PublicSubnet1, !Ref PublicSubnet2]
      SecurityGroups: [!Ref LoadBalancerSecurityGroup]
      LoadBalancerAttributes:
        - Key: idle_timeout.timeout_seconds
          Value: "120"

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref Vpc
      TargetType: ip
      Protocol: HTTP
      Port: 4100
      HealthCheckProtocol: HTTP
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 15
      Matcher:
        HttpCode: "200"
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "30"

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTPS
      Port: 443
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn: !If [CreateCertificate, !Ref Certificate, !Ref CertificateArn]
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: "443"
            StatusCode: HTTP_301

  # Validated by DNS: in the hosted zone by the stack itself; without one, the stack waits
  # until the validation record its Events show is added at the domain's DNS provider.
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Condition: CreateCertificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions: !If
        - HasHostedZone
        - - DomainName: !Ref DomainName
            HostedZoneId: !Ref HostedZoneId
        - !Ref AWS::NoValue

  DnsRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasHostedZone
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt LoadBalancer.DNSName
        HostedZoneId: !GetAtt LoadBalancer.CanonicalHostedZoneID

  # The secrets Qory makes at first start on compose, made here by Secrets Manager before
  # the task starts. A create that rolls back deletes them, so a retry under the same stack
  # name makes them anew; once a stack exists, deleting it, or a replacement in an update,
  # keeps every one (UpdateReplacePolicy has no RetainExceptOnCreate):
  # without APIARY_ENCRYPTION_SECRET no access key verifies and no stored secret reads, and
  # without APIARY_SIGNING_SECRET every machine's pin breaks. Their properties never change
  # from one release to the next (CI compares them with the previous release's template):
  # a replaced secret would be generated anew.
  #
  # Each is named after the stack and the whole UUID of its stack ID, such as
  # qory-0a1b2c3d-4e5f-11f0-8a9b-0c1d2e3f4a5b/secret-key-base. A new stack of the same name
  # has a stack ID of its own, so the secrets a deleted stack kept do not block it.
  # KeysFromStack names them by that prefix.
  #
  # The two 32-byte keys are 64 characters of 0-9a-f, the hex form Qory reads: every other
  # character excluded, and no character type required, so each character is drawn from
  # the same 16.
  SecretKeyBase:
    Type: AWS::SecretsManager::Secret
    Condition: CreateSecrets
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub
        - ${AWS::StackName}-${StackUuid}/secret-key-base
        - StackUuid: !Select [2, !Split ["/", !Ref AWS::StackId]]
      GenerateSecretString:
        PasswordLength: 86
        ExcludePunctuation: true
        IncludeSpace: false

  EncryptionSecret:
    Type: AWS::SecretsManager::Secret
    Condition: CreateSecrets
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub
        - ${AWS::StackName}-${StackUuid}/encryption-secret
        - StackUuid: !Select [2, !Split ["/", !Ref AWS::StackId]]
      GenerateSecretString:
        PasswordLength: 64
        ExcludeCharacters: ghijklmnopqrstuvwxyz
        ExcludeUppercase: true
        ExcludePunctuation: true
        IncludeSpace: false
        RequireEachIncludedType: false

  SigningSecret:
    Type: AWS::SecretsManager::Secret
    Condition: CreateSecrets
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub
        - ${AWS::StackName}-${StackUuid}/signing-secret
        - StackUuid: !Select [2, !Split ["/", !Ref AWS::StackId]]
      GenerateSecretString:
        PasswordLength: 64
        ExcludeCharacters: ghijklmnopqrstuvwxyz
        ExcludeUppercase: true
        ExcludePunctuation: true
        IncludeSpace: false
        RequireEachIncludedType: false

  DatabasePassword:
    Type: AWS::SecretsManager::Secret
    Condition: CreateSecrets
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub
        - ${AWS::StackName}-${StackUuid}/database-password
        - StackUuid: !Select [2, !Split ["/", !Ref AWS::StackId]]
      GenerateSecretString:
        PasswordLength: 40
        ExcludePunctuation: true
        IncludeSpace: false

  # The download key, split on its one colon (ProDownloadKey's pattern allows no other) into
  # the registry's user name and password: the execution role reads it to pull the image,
  # and the container never sees it. Unlike the four secrets above it is deleted with the
  # stack, kept by no policy and guarded by no stack policy: it locks no data, and it is
  # typed again. KeysFromStack does not carry it.
  RegistryCredentials:
    Type: AWS::SecretsManager::Secret
    Condition: HasDownloadKey
    Properties:
      Name: !Sub ${AWS::StackName}/download-key
      SecretString: !Sub
        - '{"username":"${Username}","password":"${Password}"}'
        - Username: !Select [0, !Split [":", !Ref ProDownloadKey]]
          Password: !Select [1, !Split [":", !Ref ProDownloadKey]]

  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Qory Apiary database
      SubnetIds: [!Ref IsolatedSubnet1, !Ref IsolatedSubnet2]

  # Restored from DatabaseSnapshot when it is set, which every later update must pass
  # unchanged: CloudFormation replaces a restored instance whose DBSnapshotIdentifier
  # changes or goes. A restored instance keeps the snapshot's user, database, password and
  # encryption. The password is read once, by each task at its start: no rotation.
  # It is made without deletion protection, and names none, so CloudFormation never sets
  # it: DatabaseProtection, below, follows DatabaseDeletionProtection once the service is
  # healthy. With it on, deleting the stack fails at the database; with it off, the delete
  # keeps a final snapshot.
  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: postgres
      EngineVersion: "18"
      DBInstanceClass: !Ref DatabaseInstanceClass
      AllocatedStorage: "20"
      StorageType: gp3
      MultiAZ: false
      PubliclyAccessible: false
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      VPCSecurityGroups: [!Ref DatabaseSecurityGroup]
      BackupRetentionPeriod: 7
      DBSnapshotIdentifier: !If [RestoreDatabase, !Ref DatabaseSnapshot, !Ref AWS::NoValue]
      StorageEncrypted: !If [RestoreDatabase, !Ref AWS::NoValue, true]
      DBName: !If [RestoreDatabase, !Ref AWS::NoValue, apiary]
      MasterUsername: !If [RestoreDatabase, !Ref AWS::NoValue, apiary]
      MasterUserPassword: !If
        - RestoreDatabase
        - !Ref AWS::NoValue
        - !If
          - CreateSecrets
          - !Sub "{{resolve:secretsmanager:${DatabasePassword}}}"
          - !Sub "{{resolve:secretsmanager:${KeysFromStack}/database-password}}"

  # The task's log. Kept when the stack is deleted, and when a create rolls back, so the
  # log of a task that never became healthy can still be read; its events go after 30 days.
  # Named, like the key secrets, after the stack and the whole UUID of its stack ID, so a
  # kept group does not block a new stack of the same name.
  LogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub
        - /qory/${AWS::StackName}-${StackUuid}
        - StackUuid: !Select [2, !Split ["/", !Ref AWS::StackId]]
      RetentionInDays: 30

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Ref AWS::StackName

  # Pulls the image, with the download key when one is given, writes the logs, and reads the
  # secrets into the container's environment: this stack's, or with KeysFromStack the ones
  # that stack kept (the -* is the suffix Secrets Manager adds to a secret's name).
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: secrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !If
                  - CreateSecrets
                  - - !Ref SecretKeyBase
                    - !Ref EncryptionSecret
                    - !Ref SigningSecret
                    - !Ref DatabasePassword
                  - - !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${KeysFromStack}/secret-key-base-*
                    - !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${KeysFromStack}/encryption-secret-*
                    - !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${KeysFromStack}/signing-secret-*
                    - !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${KeysFromStack}/database-password-*
              - !If
                - HasDownloadKey
                - Effect: Allow
                  Action: secretsmanager:GetSecretValue
                  Resource: !Ref RegistryCredentials
                - !Ref AWS::NoValue

  # ECS Exec's channels, so support can run a release command (bin/apiary eval) in the
  # running task. No output names it: nothing in the install needs it.
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ecs-exec
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ssmmessages:CreateControlChannel
                  - ssmmessages:CreateDataChannel
                  - ssmmessages:OpenControlChannel
                  - ssmmessages:OpenDataChannel
                Resource: "*"

  # Part 1's settings, from the parameters and Secrets Manager. The database's certificate
  # is checked against the RDS bundle the image carries. The image is the edition's, at
  # Version when it is given, else at the Release mapping's version for that edition; with
  # Test image, exactly the image it names.
  # APIARY_ACCEPT_SIGNING_FINGERPRINT is set only when Accept a new signing key is.
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "512"
      Memory: "1024"
      RuntimePlatform:
        OperatingSystemFamily: LINUX
        CpuArchitecture: !Ref CpuArchitecture
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: apiary
          Image: !If
            - HasTestImage
            - !Ref TestImage
            - !Sub
              - ${Repository}:${Tag}
              - Repository: !If
                  - IsPro
                  - !FindInMap [Images, Pro, Repository]
                  - !FindInMap [Images, Community, Repository]
                Tag: !If
                  - HasVersionOverride
                  - !Ref VersionOverride
                  - !If
                    - IsPro
                    - !FindInMap [Release, Versions, ProVersion]
                    - !FindInMap [Release, Versions, CommunityVersion]
          Essential: true
          PortMappings:
            - ContainerPort: 4100
              Protocol: tcp
          LinuxParameters:
            InitProcessEnabled: true
          RepositoryCredentials: !If
            - HasDownloadKey
            - CredentialsParameter: !Ref RegistryCredentials
            - !Ref AWS::NoValue
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: apiary
          Environment:
            - Name: PUBLIC_URL
              Value: !Sub https://${DomainName}
            - Name: DATABASE_URL
              Value: !Sub postgres://apiary@${Database.Endpoint.Address}:5432/apiary?sslmode=verify-full&sslrootcert=/app/certs/rds-global-bundle.pem
            - Name: TRUSTED_PROXIES
              Value: 10.0.0.0/16
            - !If
              - HasAcceptSigningKey
              - Name: APIARY_ACCEPT_SIGNING_FINGERPRINT
                Value: !Ref AcceptSigningKey
              - !Ref AWS::NoValue
          # A secret given by name is read from this account and region.
          Secrets:
            - Name: SECRET_KEY_BASE
              ValueFrom: !If [CreateSecrets, !Ref SecretKeyBase, !Sub "${KeysFromStack}/secret-key-base"]
            - Name: APIARY_ENCRYPTION_SECRET
              ValueFrom: !If [CreateSecrets, !Ref EncryptionSecret, !Sub "${KeysFromStack}/encryption-secret"]
            - Name: APIARY_SIGNING_SECRET
              ValueFrom: !If [CreateSecrets, !Ref SigningSecret, !Sub "${KeysFromStack}/signing-secret"]
            - Name: DATABASE_PASSWORD
              ValueFrom: !If [CreateSecrets, !Ref DatabasePassword, !Sub "${KeysFromStack}/database-password"]

  # One task. An upgrade starts the new task beside the old one, which serves until the new
  # one has migrated under Ecto's lock and answers /health; the old release runs on the new
  # schema meanwhile, as migrations written expand/contract allow. A new task that never
  # becomes healthy trips the circuit breaker, which rolls the service back, and the stack
  # update with it. The grace period covers a long migration, during which nothing listens.
  Service:
    Type: AWS::ECS::Service
    DependsOn: [HttpsListener, HttpListener]
    Properties:
      ServiceName: apiary
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: 1
      EnableExecuteCommand: true
      HealthCheckGracePeriodSeconds: 600
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: [!Ref PublicSubnet1, !Ref PublicSubnet2]
          SecurityGroups: [!Ref TaskSecurityGroup]
      LoadBalancers:
        - ContainerName: apiary
          ContainerPort: 4100
          TargetGroupArn: !Ref TargetGroup

  # The stack policy, set once at creation by a function of the stack's own, so nobody has
  # to set it. On Update and Delete the function answers without acting: a policy changed
  # in a later release reaches new stacks only. It answers CloudFormation even when its call
  # fails, so the stack never waits on it, and a failed call fails the create; a request
  # that names another stack fails and changes nothing. Its role may set the policy of this
  # stack and nothing else, and write its own log group, which is kept as the task's is:
  # a call that fails a create leaves its trace there.
  # The runtime is pinned, and kept current with each release.
  StackPolicyLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub
        - /qory/${AWS::StackName}-${StackUuid}/stack-policy
        - StackUuid: !Select [2, !Split ["/", !Ref AWS::StackId]]
      RetentionInDays: 30

  StackPolicyRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: set-stack-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: cloudformation:SetStackPolicy
                Resource: !Ref AWS::StackId
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt StackPolicyLogGroup.Arn

  StackPolicyFunction:
    Type: AWS::Lambda::Function
    Properties:
      Description: Sets the stack's policy once, at creation.
      Runtime: python3.13
      Handler: index.handler
      Role: !GetAtt StackPolicyRole.Arn
      Timeout: 60
      LoggingConfig:
        LogGroup: !Ref StackPolicyLogGroup
      # The stack and the policy are the function's own, never the event's: the policy of
      # deploy/aws/stack-policy.json, which CI keeps the same
      # (scripts/aws-template-check.py policy).
      Environment:
        Variables:
          STACK_ID: !Ref AWS::StackId
          STACK_POLICY: |
            {
              "Statement": [
                {"Effect": "Allow", "Action": "Update:*", "Principal": "*", "Resource": "*"},
                {
                  "Effect": "Deny",
                  "Action": ["Update:Replace", "Update:Delete"],
                  "Principal": "*",
                  "Resource": [
                    "LogicalResourceId/Database",
                    "LogicalResourceId/SecretKeyBase",
                    "LogicalResourceId/EncryptionSecret",
                    "LogicalResourceId/SigningSecret",
                    "LogicalResourceId/DatabasePassword"
                  ]
                }
              ]
            }
      # At worst about 52 seconds, under the 60 of its timeout: two calls of at most
      # 5 + 15 seconds with a back-off of at most 2 between them, then 10 for the answer.
      Code:
        ZipFile: |
          import json
          import os
          import urllib.request

          import boto3
          from botocore.config import Config


          def handler(event, context):
              status, reason = "SUCCESS", ""
              try:
                  if event["StackId"] != os.environ["STACK_ID"]:
                      raise ValueError(f"the request names another stack, {event['StackId']}")
                  if event["RequestType"] == "Create":
                      config = Config(
                          connect_timeout=5,
                          read_timeout=15,
                          retries={"total_max_attempts": 2, "mode": "standard"},
                      )
                      boto3.client("cloudformation", config=config).set_stack_policy(
                          StackName=os.environ["STACK_ID"],
                          StackPolicyBody=os.environ["STACK_POLICY"],
                      )
              except Exception as error:
                  status, reason = "FAILED", f"The stack policy was not set: {error}"[:1000]
                  print(reason)

              # Always answered, so the stack never waits on a function that failed.
              body = json.dumps(
                  {
                      "Status": status,
                      "Reason": reason or "Done.",
                      "PhysicalResourceId": event.get("PhysicalResourceId") or "stack-policy",
                      "StackId": event["StackId"],
                      "RequestId": event["RequestId"],
                      "LogicalResourceId": event["LogicalResourceId"],
                  }
              ).encode()
              request = urllib.request.Request(
                  event["ResponseURL"], data=body, method="PUT", headers={"Content-Type": ""}
              )
              urllib.request.urlopen(request, timeout=10)

  # No property but the function: what the function sets is its own. CloudFormation waits
  # at most ServiceTimeout seconds for its answer.
  StackPolicy:
    Type: Custom::StackPolicy
    Properties:
      ServiceToken: !GetAtt StackPolicyFunction.Arn
      ServiceTimeout: "300"

  # The database's deletion protection, set by a function of the stack's own once the
  # service is healthy: DatabaseProtection is made after the service, whose create waits
  # until its task answers /health. A create that fails before then leaves the database
  # unprotected, so the rollback deletes it with the rest. On Create, and on each Update,
  # DatabaseDeletionProtection changed, the database replaced or an update rolled back, the
  # function sets the protection to the value the request gives it, in place, on the
  # database its environment names; a request that names another database fails. On Delete
  # it changes nothing, so deleting the stack with the protection on still fails at the
  # database; only while the stack's create rolls back does it turn the protection off, so
  # that rollback can delete the database too. It answers CloudFormation even when its call
  # fails, and a request that names another stack fails and changes nothing. Its role may
  # read and modify this database alone, read this stack, and write its own log group, which
  # is kept as the task's is. The runtime is pinned, and kept current with each release.
  DatabaseProtectionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub
        - /qory/${AWS::StackName}-${StackUuid}/database-protection
        - StackUuid: !Select [2, !Split ["/", !Ref AWS::StackId]]
      RetentionInDays: 30

  DatabaseProtectionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: database-deletion-protection
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - rds:DescribeDBInstances
                  - rds:ModifyDBInstance
                Resource: !Sub arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:db:${Database}
              - Effect: Allow
                Action: cloudformation:DescribeStacks
                Resource: !Ref AWS::StackId
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt DatabaseProtectionLogGroup.Arn

  DatabaseProtectionFunction:
    Type: AWS::Lambda::Function
    Properties:
      Description: Sets the database's deletion protection once the service is healthy.
      Runtime: python3.13
      Handler: index.handler
      Role: !GetAtt DatabaseProtectionRole.Arn
      Timeout: 600
      LoggingConfig:
        LogGroup: !Ref DatabaseProtectionLogGroup
      # The stack and the database are the function's own, never the request's. The request
      # gives whether to protect, and names the database only so that a replaced database
      # sends an Update: the function acts only when that name is its own.
      Environment:
        Variables:
          STACK_ID: !Ref AWS::StackId
          DATABASE: !Ref Database
      # A database busy with a backup or another change refuses the change; it is asked
      # again every 20 seconds while at least 120 of the 600 are left. A call takes at most
      # about 42 seconds (two tries of 5 + 15, a back-off of at most 2 between them), so
      # the last round, the answer's 10 included, ends inside the timeout.
      Code:
        ZipFile: |
          import json
          import os
          import time
          import urllib.request

          import boto3
          from botocore.config import Config

          CONFIG = Config(
              connect_timeout=5,
              read_timeout=15,
              retries={"total_max_attempts": 2, "mode": "standard"},
          )


          def protect(rds, database, wanted, context):
              while True:
                  instance = rds.describe_db_instances(DBInstanceIdentifier=database)["DBInstances"][0]
                  if instance["DeletionProtection"] == wanted:
                      return
                  try:
                      rds.modify_db_instance(DBInstanceIdentifier=database, DeletionProtection=wanted)
                      return
                  except rds.exceptions.InvalidDBInstanceStateFault:
                      if context.get_remaining_time_in_millis() < 120_000:
                          raise
                      time.sleep(20)


          def handler(event, context):
              status, reason = "SUCCESS", ""
              try:
                  if event["StackId"] != os.environ["STACK_ID"]:
                      raise ValueError(f"the request names another stack, {event['StackId']}")
                  rds = boto3.client("rds", config=CONFIG)
                  database = os.environ["DATABASE"]
                  if event["RequestType"] in ("Create", "Update"):
                      named = event["ResourceProperties"]["Database"]
                      if named != database:
                          raise ValueError(f"the request names the database {named}, not {database}")
                      wanted = event["ResourceProperties"]["DeletionProtection"] == "true"
                      protect(rds, database, wanted, context)
                  else:
                      stack = boto3.client("cloudformation", config=CONFIG).describe_stacks(
                          StackName=os.environ["STACK_ID"]
                      )["Stacks"][0]
                      # A create rolling back: the database goes too, so nothing may hold it.
                      if stack["StackStatus"] == "ROLLBACK_IN_PROGRESS":
                          try:
                              protect(rds, database, False, context)
                          except rds.exceptions.DBInstanceNotFoundFault:
                              pass
              except Exception as error:
                  status, reason = "FAILED", f"The database's deletion protection was not set: {error}"[:1000]
                  print(reason)

              # Always answered, so the stack never waits on a function that failed.
              body = json.dumps(
                  {
                      "Status": status,
                      "Reason": reason or "Done.",
                      "PhysicalResourceId": event.get("PhysicalResourceId") or "database-protection",
                      "StackId": event["StackId"],
                      "RequestId": event["RequestId"],
                      "LogicalResourceId": event["LogicalResourceId"],
                  }
              ).encode()
              request = urllib.request.Request(
                  event["ResponseURL"], data=body, method="PUT", headers={"Content-Type": ""}
              )
              urllib.request.urlopen(request, timeout=10)

  # Made after the service, so once its task is healthy. Its setting is
  # DatabaseDeletionProtection's. It names the database too, so that a replaced database
  # sends it an Update, after the function's role and environment have moved to the new
  # one (each refers to Database, and DatabaseProtection to the function), and the new
  # database is protected as the old one was. CloudFormation waits at most ServiceTimeout
  # seconds for the function's answer.
  DatabaseProtection:
    Type: Custom::DatabaseProtection
    DependsOn: Service
    Properties:
      ServiceToken: !GetAtt DatabaseProtectionFunction.Arn
      ServiceTimeout: "660"
      Database: !Ref Database
      DeletionProtection: !If [ProtectDatabase, "true", "false"]

# Links into the AWS console, and the values a person reads; no output is a command (CI
# checks it: scripts/aws-template-check.py outputs).
Outputs:
  Url:
    Description: Qory's address.
    Value: !Sub https://${DomainName}
  LoadBalancerDnsName:
    Description: Point the domain here with a CNAME when no hosted zone was given.
    Value: !GetAtt LoadBalancer.DNSName
  Edition:
    Description: The edition the stack runs.
    Value: !Ref Edition
  # With Test image, the image the stack runs in place of a version.
  Version:
    Description: The version the stack runs.
    Value: !If
      - HasTestImage
      - !Sub "Test image ${TestImage}"
      - !If
        - HasVersionOverride
        - !Ref VersionOverride
        - !If
          - IsPro
          - !FindInMap [Release, Versions, ProVersion]
          - !FindInMap [Release, Versions, CommunityVersion]
  Logs:
    Description: The task's log group in CloudWatch, kept 30 days.
    Value: !Sub
      - https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#logsV2:log-groups/log-group/$252Fqory$252F${AWS::StackName}-${StackUuid}
      - StackUuid: !Select [2, !Split ["/", !Ref AWS::StackId]]
  # Until Qory is set up, each start of the task logs "Set up Qory Apiary at
  # https://<domain>/setup/<code>." in the log group Logs links to. The link opens that log
  # group's events filtered to "/setup/", the console's filterPattern escaped as the Logs
  # link escapes the group's name. The filter is a convenience: the log group is the source,
  # and without it the line is found by searching the group for /setup/.
  SetUp:
    Description: The set-up link is in the log; open it once.
    Value: !Sub
      - https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#logsV2:log-groups/log-group/$252Fqory$252F${AWS::StackName}-${StackUuid}/log-events$3FfilterPattern$3D$2522$252Fsetup$252F$2522
      - StackUuid: !Select [2, !Split ["/", !Ref AWS::StackId]]
  Service:
    Description: The service's health and events in ECS.
    Value: !Sub https://${AWS::Region}.console.aws.amazon.com/ecs/v2/clusters/${Cluster}/services/${Service.Name}/health?region=${AWS::Region}
  KeysSecrets:
    Description: The key secrets, kept when the stack is deleted, to copy apart from the database's backups.
    Value: !If
      - CreateSecrets
      - !Join [",", [!Ref SecretKeyBase, !Ref EncryptionSecret, !Ref SigningSecret, !Ref DatabasePassword]]
      - !Sub ${KeysFromStack}/secret-key-base,${KeysFromStack}/encryption-secret,${KeysFromStack}/signing-secret,${KeysFromStack}/database-password
  KeysSecretsLink:
    Description: The keys needed to restore this instance's data, in AWS Secrets Manager.
    Value: !Sub
      - https://${AWS::Region}.console.aws.amazon.com/secretsmanager/listsecrets?region=${AWS::Region}&search=all%3D${Prefix}%2F
      - Prefix: !If
          - CreateSecrets
          - !Sub
            - ${AWS::StackName}-${StackUuid}
            - StackUuid: !Select [2, !Split ["/", !Ref AWS::StackId]]
          - !Ref KeysFromStack
  DatabaseSnapshots:
    Description: "The RDS console's database snapshots in this region. A deleted stack's final database snapshot is listed there."
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/rds/home?region=${AWS::Region}#snapshots-list:"
