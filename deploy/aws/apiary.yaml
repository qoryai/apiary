# Qory Apiary on AWS: one Fargate task behind an Application Load Balancer, RDS for
# PostgreSQL, and the secrets Qory Apiary makes at first start kept in Secrets Manager.
#
# The version to install is found when the stack is created or updated: the Version
# resource (below) looks up the newest release of the edition in the edition's image
# repository, or checks the one typed under Version, and the task runs that image by its
# digest. A release writes only this template's version into the Template mapping
# (scripts/aws-template-release.py --version X.Y.Z); here, in the repository, it is empty.
# [test copy]
# For a test before a release, an upload by hand names an image under Test image instead.
# In the repository's template, comment markers set the test parts apart:
# scripts/aws-template-release.py --copy release leaves them out of a release's copy, and
# --copy test keeps them.
# [/test copy]
#
# Upgrade with the console's Update, or with `aws cloudformation deploy`, which keep the
# parameters they are not given, Version left empty: with the newest release's template
# when that release is of a newer minor than this template, else with this template and
# something new under Look for a newer release. KeysFromStack
# and DatabaseSnapshot keep their values for the life of the stack: an update that drops
# DatabaseSnapshot replaces the restored database with an empty one. The stack sets its
# stack policy itself once its create completes, and again once each update completes or
# rolls back (StackPolicyRule, below), the policy of deploy/aws/stack-policy.json in the
# repository: it refuses any update that would replace or delete the database or a key's
# secret.
AWSTemplateFormatVersion: "2010-09-09"
Description: Qory Apiary on ECS Fargate, with RDS for PostgreSQL, an Application Load Balancer and Secrets Manager.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: Edition }
        Parameters: [Edition, ProDownloadKey]
      - Label: { default: Address }
        Parameters: [DomainName, HostedZoneId, CertificateArn]
      - Label: { default: Version }
        Parameters: [VersionOverride, LookForNewerRelease]
      - Label: { default: Size }
        Parameters: [DatabaseInstanceClass, CpuArchitecture]
      - Label: { default: Restore }
        Parameters: [KeysFromStack, DatabaseSnapshot]
      - Label: { default: Recovery }
        Parameters: [AcceptSigningKey, DatabaseDeletionProtection]
      - Label: { default: Advanced }
        Parameters: [ErlangOptions]
      # [test copy]
      - Label: { default: For testing only }
        Parameters: [TestImage]
      # [/test copy]
    ParameterLabels:
      Edition: { default: Edition }
      ProDownloadKey: { default: Qory Apiary Pro download key }
      DomainName: { default: Domain name }
      HostedZoneId: { default: Route 53 hosted zone (recommended) }
      CertificateArn: { default: Your ACM certificate (optional) }
      VersionOverride: { default: Version (leave empty for the newest) }
      LookForNewerRelease: { default: Look for a newer release }
      DatabaseInstanceClass: { default: Database instance class }
      CpuArchitecture: { default: CPU architecture }
      KeysFromStack: { default: Keys of a deleted stack (optional) }
      DatabaseSnapshot: { default: Database snapshot to restore (optional) }
      AcceptSigningKey: { default: Accept a new signing key (fingerprint) }
      DatabaseDeletionProtection: { default: Protect the database from deletion }
      ErlangOptions: { default: Extra Erlang options (optional) }
      TestImage: { default: Test image (leave empty) }  # [test copy]

Parameters:
  Edition:
    Type: String
    Default: Qory Apiary Community
    AllowedValues: [Qory Apiary Community, Qory Apiary Pro]
    Description: "Qory Apiary Community is free and open source. Qory Apiary Pro needs the download key we sent you. Moving from Qory Apiary Community to Qory Apiary Pro is possible later; the way back is not."
  # <account>:<token>, split on its one colon into the registry's user name and password.
  ProDownloadKey:
    Type: String
    Default: ""
    NoEcho: true
    AllowedPattern: '^$|^[A-Za-z0-9-]+:[^\s"\\:]+$'
    ConstraintDescription: "The download key as we sent it: an account name, a colon and a token."
    Description: "Only for Qory Apiary Pro: the download key we sent you. Leave empty for Qory Apiary Community. A revoked or expired key stops the running instance at its next task replacement."
  DomainName:
    Type: String
    MinLength: 1
    Description: For example qory.example.com.
  HostedZoneId:
    Type: String
    Default: ""
    Description: "A Route 53 hosted zone for the domain: the stack makes the certificate and the record. Without one, add two records at your DNS provider: the certificate's validation record, which the stack's Events show while it waits, and a CNAME to the LoadBalancerDnsName output."
  CertificateArn:
    Type: String
    Default: ""
    Description: "An ACM certificate for the domain, in this region. Empty: the stack makes one."
  VersionOverride:
    Type: String
    Default: ""
    Description: "Leave empty to install the newest release of the edition, found when the stack is created or updated. Type a version, such as 0.2.0, to install exactly that one. The version found keeps running until an update finds another."
  # Only passed to the Version resource: anything new here makes an update look up the
  # newest release again, when no other value changes.
  LookForNewerRelease:
    Type: String
    Default: ""
    Description: "With Version empty, an update installs the newest release. When nothing else changes, type something new here, such as today's date, and update."
  DatabaseInstanceClass:
    Type: String
    Default: db.t4g.micro
  CpuArchitecture:
    Type: String
    Default: X86_64
    AllowedValues: [X86_64, ARM64]
  KeysFromStack:
    Type: String
    Default: ""
    Description: "The name a deleted stack's kept key secrets start with, the part before /secret-key-base, such as qory-0a1b2c3d-4e5f-11f0-8a9b-0c1d2e3f4a5b: this stack uses those secrets instead of generating new ones. Keep it as it was on every later update."
  DatabaseSnapshot:
    Type: String
    Default: ""
    Description: A snapshot to restore the database from, such as a deleted stack's final snapshot. Keep it as it was on every later update.
  AcceptSigningKey:
    Type: String
    Default: ""
    Description: "Leave empty. Only when the log says the signing key is not the one the machines pinned: paste the fingerprint it names, then Update."
  DatabaseDeletionProtection:
    Type: String
    Default: "Yes"
    AllowedValues: ["Yes", "No"]
    Description: "Yes turns it on once Qory Apiary first starts healthy, so a failed install still rolls back. To delete the stack, Update with No first, then Delete. With No, the database's final snapshot is kept when the stack is deleted."
  # Passed to the container as ELIXIR_ERL_OPTIONS, and only when set. The release's start
  # script puts it on the Erlang runtime's command line; the image sets none.
  ErlangOptions:
    Type: String
    Default: ""
    Description: "Extra options for the Erlang runtime when Qory Apiary starts, passed as ELIXIR_ERL_OPTIONS. Leave empty unless you know you need it."
  # [test copy]
  # A pre-release image, such as ghcr.io/qoryai/apiary-prerelease:sha-<7>, which
  # .github/workflows/prerelease.yml publishes. It replaces the Edition's image and version,
  # and is pulled with the download key, whatever the Edition (TestImageNeedsDownloadKey).
  TestImage:
    Type: String
    Default: ""
    Description: "Leave empty. Only for Qory Apiary's pre-release tests: a full image reference, which replaces the image the Edition and Version pick. Needs the download key above."
  # [/test copy]

# The template's version, which a release writes in (scripts/aws-template-release.py
# --version X.Y.Z): the Version resource refuses a release of a newer minor than this
# template. Empty here, in the repository, which skips that check. The images are each
# edition's.
Mappings:
  Template:
    Release:
      Version: ""
  Images:
    Community:
      Repository: ghcr.io/qoryai/apiary
    Pro:
      Repository: ghcr.io/qoryai/apiary-pro

Rules:
  # A restored database keeps the snapshot's password and holds what the old keys
  # encrypted: with new keys no task boots.
  KeysWithDatabaseSnapshot:
    RuleCondition: !Not [!Equals [!Ref DatabaseSnapshot, ""]]
    Assertions:
      - Assert: !Not [!Equals [!Ref KeysFromStack, ""]]
        AssertDescription: "A database snapshot needs the keys of the stack it came from: set Keys of a deleted stack."
  ProNeedsDownloadKey:
    RuleCondition: !Equals [!Ref Edition, Qory Apiary Pro]
    Assertions:
      - Assert: !Not [!Equals [!Ref ProDownloadKey, ""]]
        AssertDescription: Qory Apiary Pro needs its download key.
  # Qory Apiary Pro's image is built for linux/amd64 alone.
  ProOnX86:
    RuleCondition: !Equals [!Ref Edition, Qory Apiary Pro]
    Assertions:
      - Assert: !Equals [!Ref CpuArchitecture, X86_64]
        AssertDescription: Qory Apiary Pro runs on X86_64 only.
  # [test copy]
  # A test image is pulled from a private package, with the download key.
  TestImageNeedsDownloadKey:
    RuleCondition: !Not [!Equals [!Ref TestImage, ""]]
    Assertions:
      - Assert: !Not [!Equals [!Ref ProDownloadKey, ""]]
        AssertDescription: "A test image needs the download key: set Qory Apiary Pro download key."
  # [/test copy]

Conditions:
  # Qory Apiary Community's releases are looked up anonymously, Qory Apiary Pro's with the
  # download key (the Version resource).
  IsCommunity: !Equals [!Ref Edition, Qory Apiary Community]
  HasTestImage: !Not [!Equals [!Ref TestImage, ""]]  # [test copy]
  LookUpVersion: !Equals [!Ref TestImage, ""]  # [test copy]
  # A key given with Qory Apiary Community is used for the pull too.
  HasDownloadKey: !Not [!Equals [!Ref ProDownloadKey, ""]]
  HasAcceptSigningKey: !Not [!Equals [!Ref AcceptSigningKey, ""]]
  HasErlangOptions: !Not [!Equals [!Ref ErlangOptions, ""]]
  ProtectDatabase: !Equals [!Ref DatabaseDeletionProtection, "Yes"]
  HasHostedZone: !Not [!Equals [!Ref HostedZoneId, ""]]
  CreateCertificate: !Equals [!Ref CertificateArn, ""]
  # With KeysFromStack, the stack makes no secret: it reads the ones the named stack kept.
  CreateSecrets: !Equals [!Ref KeysFromStack, ""]
  RestoreDatabase: !Not [!Equals [!Ref DatabaseSnapshot, ""]]

Resources:
  # The network: two zones, the load balancer and the task in public subnets, the database
  # in isolated ones (the VPC's main route table, with no route out). No NAT gateway: the
  # task has a public address and admits only the load balancer.
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.0.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  IsolatedSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.10.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]

  IsolatedSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.11.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]

  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Qory Apiary load balancer
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIpv6: "::/0" }
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIpv6: "::/0" }

  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Qory Apiary task
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 4100
          ToPort: 4100
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Qory Apiary database
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref TaskSecurityGroup

  # The load balancer. The idle timeout keeps the console's WebSockets open; /health is
  # plain HTTP on 4100 and answers once migrations have run.
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: application
      Scheme: internet-facing
      Subnets: [!Ref PublicSubnet1, !Ref PublicSubnet2]
      SecurityGroups: [!Ref LoadBalancerSecurityGroup]
      LoadBalancerAttributes:
        - Key: idle_timeout.timeout_seconds
          Value: "120"

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref Vpc
      TargetType: ip
      Protocol: HTTP
      Port: 4100
      HealthCheckProtocol: HTTP
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 15
      Matcher:
        HttpCode: "200"
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "30"

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTPS
      Port: 443
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn: !If [CreateCertificate, !Ref Certificate, !Ref CertificateArn]
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: "443"
            StatusCode: HTTP_301

  # Validated by DNS: in the hosted zone by the stack itself; without one, the stack waits
  # until the validation record its Events show is added at the domain's DNS provider.
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Condition: CreateCertificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions: !If
        - HasHostedZone
        - - DomainName: !Ref DomainName
            HostedZoneId: !Ref HostedZoneId
        - !Ref AWS::NoValue

  DnsRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasHostedZone
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt LoadBalancer.DNSName
        HostedZoneId: !GetAtt LoadBalancer.CanonicalHostedZoneID

  # The secrets Qory Apiary makes at first start on compose, made here by Secrets Manager
  # before the task starts. A create that rolls back deletes them, so a retry under the same
  # stack name makes them anew; once a stack exists, deleting it, or a replacement in an
  # update, keeps every one (UpdateReplacePolicy has no RetainExceptOnCreate):
  # without APIARY_ENCRYPTION_SECRET no access key verifies and no stored secret reads, and
  # without APIARY_SIGNING_SECRET every machine's pin breaks. Their properties never change
  # from one release to the next (CI compares them with the previous release's template):
  # a replaced secret would be generated anew.
  #
  # Each is named after the stack and the whole UUID of its stack ID, such as
  # qory-0a1b2c3d-4e5f-11f0-8a9b-0c1d2e3f4a5b/secret-key-base. A new stack of the same name
  # has a new stack ID, so the secrets a deleted stack kept do not block it.
  # KeysFromStack names them by that prefix.
  #
  # The two 32-byte keys are 64 characters of 0-9a-f, the hex form Qory Apiary reads: every
  # other character excluded, and no character type required, so each character is drawn
  # from the same 16.
  SecretKeyBase:
    Type: AWS::SecretsManager::Secret
    Condition: CreateSecrets
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub
        - ${AWS::StackName}-${StackUuid}/secret-key-base
        - StackUuid: !Select [2, !Split ["/", !Ref AWS::StackId]]
      GenerateSecretString:
        PasswordLength: 86
        ExcludePunctuation: true
        IncludeSpace: false

  EncryptionSecret:
    Type: AWS::SecretsManager::Secret
    Condition: CreateSecrets
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub
        - ${AWS::StackName}-${StackUuid}/encryption-secret
        - StackUuid: !Select [2, !Split ["/", !Ref AWS::StackId]]
      GenerateSecretString:
        PasswordLength: 64
        ExcludeCharacters: ghijklmnopqrstuvwxyz
        ExcludeUppercase: true
        ExcludePunctuation: true
        IncludeSpace: false
        RequireEachIncludedType: false

  SigningSecret:
    Type: AWS::SecretsManager::Secret
    Condition: CreateSecrets
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub
        - ${AWS::StackName}-${StackUuid}/signing-secret
        - StackUuid: !Select [2, !Split ["/", !Ref AWS::StackId]]
      GenerateSecretString:
        PasswordLength: 64
        ExcludeCharacters: ghijklmnopqrstuvwxyz
        ExcludeUppercase: true
        ExcludePunctuation: true
        IncludeSpace: false
        RequireEachIncludedType: false

  DatabasePassword:
    Type: AWS::SecretsManager::Secret
    Condition: CreateSecrets
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub
        - ${AWS::StackName}-${StackUuid}/database-password
        - StackUuid: !Select [2, !Split ["/", !Ref AWS::StackId]]
      GenerateSecretString:
        PasswordLength: 40
        ExcludePunctuation: true
        IncludeSpace: false

  # The download key, split on its one colon (ProDownloadKey's pattern allows no other) into
  # the registry's user name and password: the execution role reads it to pull the image,
  # and the container never sees it. Unlike the four secrets above it is deleted with the
  # stack, kept by no policy and guarded by no stack policy: it locks no data, and it is
  # typed again. KeysFromStack does not carry it.
  RegistryCredentials:
    Type: AWS::SecretsManager::Secret
    Condition: HasDownloadKey
    Properties:
      Name: !Sub ${AWS::StackName}/download-key
      SecretString: !Sub
        - '{"username":"${Username}","password":"${Password}"}'
        - Username: !Select [0, !Split [":", !Ref ProDownloadKey]]
          Password: !Select [1, !Split [":", !Ref ProDownloadKey]]

  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Qory Apiary database
      SubnetIds: [!Ref IsolatedSubnet1, !Ref IsolatedSubnet2]

  # Restored from DatabaseSnapshot when it is set, which every later update must pass
  # unchanged: CloudFormation replaces a restored instance whose DBSnapshotIdentifier
  # changes or goes. A restored instance keeps the snapshot's user, database, password and
  # encryption. The password is read once, by each task at its start: no rotation.
  # It is made without deletion protection, and names none, so CloudFormation never sets
  # it: DatabaseProtection, below, follows DatabaseDeletionProtection once the service is
  # healthy. With it on, deleting the stack fails at the database; with it off, the delete
  # keeps a final snapshot.
  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: postgres
      EngineVersion: "18"
      DBInstanceClass: !Ref DatabaseInstanceClass
      AllocatedStorage: "20"
      StorageType: gp3
      MultiAZ: false
      PubliclyAccessible: false
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      VPCSecurityGroups: [!Ref DatabaseSecurityGroup]
      BackupRetentionPeriod: 7
      DBSnapshotIdentifier: !If [RestoreDatabase, !Ref DatabaseSnapshot, !Ref AWS::NoValue]
      StorageEncrypted: !If [RestoreDatabase, !Ref AWS::NoValue, true]
      DBName: !If [RestoreDatabase, !Ref AWS::NoValue, apiary]
      MasterUsername: !If [RestoreDatabase, !Ref AWS::NoValue, apiary]
      MasterUserPassword: !If
        - RestoreDatabase
        - !Ref AWS::NoValue
        - !If
          - CreateSecrets
          - !Sub "{{resolve:secretsmanager:${DatabasePassword}}}"
          - !Sub "{{resolve:secretsmanager:${KeysFromStack}/database-password}}"

  # The task's log. Kept when the stack is deleted, and when a create rolls back, so the
  # log of a task that never became healthy can still be read; its events go after 30 days.
  # Named, like the key secrets, after the stack and the whole UUID of its stack ID, so a
  # kept group does not block a new stack of the same name.
  LogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub
        - /qory/${AWS::StackName}-${StackUuid}
        - StackUuid: !Select [2, !Split ["/", !Ref AWS::StackId]]
      RetentionInDays: 30

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Ref AWS::StackName

  # Pulls the image, with the download key when one is given, writes the logs, and reads the
  # secrets into the container's environment: this stack's, or with KeysFromStack the ones
  # that stack kept (the -* is the suffix Secrets Manager adds to a secret's name).
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: secrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !If
                  - CreateSecrets
                  - - !Ref SecretKeyBase
                    - !Ref EncryptionSecret
                    - !Ref SigningSecret
                    - !Ref DatabasePassword
                  - - !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${KeysFromStack}/secret-key-base-*
                    - !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${KeysFromStack}/encryption-secret-*
                    - !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${KeysFromStack}/signing-secret-*
                    - !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${KeysFromStack}/database-password-*
              - !If
                - HasDownloadKey
                - Effect: Allow
                  Action: secretsmanager:GetSecretValue
                  Resource: !Ref RegistryCredentials
                - !Ref AWS::NoValue

  # ECS Exec's channels, so support can run a release command (bin/apiary eval) in the
  # running task. No output names it: nothing in the install needs it.
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ecs-exec
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ssmmessages:CreateControlChannel
                  - ssmmessages:CreateDataChannel
                  - ssmmessages:OpenControlChannel
                  - ssmmessages:OpenDataChannel
                Resource: "*"

  # The version to install, found by a function in this stack when the stack is created or
  # updated: with Version empty, the newest release of the edition, the highest tag of
  # the form X.Y.Z in the edition's repository, never "latest"; with a version typed, exactly
  # that one. The image's digest pins it: the task runs <repository>@sha256:..., so a
  # task replacement or a moved tag never changes what runs, only a create or update does.
  # Qory Apiary Pro's repository is read with the download key, which the function reads
  # from RegistryCredentials by the secret's ARN: the key itself is never one of the
  # resource's properties. Qory Apiary Community's is read anonymously.
  #
  # CloudFormation sends the resource an update only when one of its properties changes, so
  # its properties are every value on the form but the download key, Look for a newer
  # release included, and the template's version: an update that changes anything but the key looks up the newest release
  # again, and Look for a newer release does it when nothing else changes. Each create and
  # update answers with a new resource ID, the version and digest in it, so that a later
  # step failing returns the stack to the old ID and its image; an update sent while the
  # stack's update rolls back answers with the version and digest of the ID it is given,
  # looking nothing up. A typed version older than the one the stack runs is refused, and
  # a release of a newer minor than the template's (the Template mapping, empty in the
  # repository, which skips that check): migrations only go forward, and a patch release
  # never needs a template change. A delete changes nothing.
  #
  # The function never logs the request, the key or the registry's token, and never follows
  # a redirect, which would carry the key or the token to another host. It answers
  # CloudFormation even when it fails. Its role may read the download key's secret, read
  # this stack, and write VersionLogGroup, which is kept as the task's is. The runtime is
  # pinned, and kept current with each release.
  VersionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub
        - /qory/${AWS::StackName}-${StackUuid}/version
        - StackUuid: !Select [2, !Split ["/", !Ref AWS::StackId]]
      RetentionInDays: 30

  VersionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: find-version
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - !If
                - HasDownloadKey
                - Effect: Allow
                  Action: secretsmanager:GetSecretValue
                  Resource: !Ref RegistryCredentials
                - !Ref AWS::NoValue
              - Effect: Allow
                Action: cloudformation:DescribeStacks
                Resource: !Ref AWS::StackId
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt VersionLogGroup.Arn

  VersionFunction:
    Type: AWS::Lambda::Function
    Properties:
      Description: Finds the version to install and its image's digest when the stack is created or updated.
      Runtime: python3.13
      Handler: index.handler
      Role: !GetAtt VersionRole.Arn
      Timeout: 300
      LoggingConfig:
        LogGroup: !Ref VersionLogGroup
      Environment:
        Variables:
          STACK_ID: !Ref AWS::StackId
      # Each call to the registry waits at most 10 seconds, and a page of tags holds 1000.
      # A registry that refuses (401 or 403), cannot be reached (a network error or 5xx), or
      # has no such release fails the resource with a message that says so.
      Code:
        ZipFile: |
          import base64
          import json
          import os
          import re
          import urllib.error
          import urllib.request

          import boto3
          from botocore.config import Config

          CONFIG = Config(connect_timeout=5, read_timeout=15, retries={"total_max_attempts": 2, "mode": "standard"})
          RELEASE = re.compile(r"(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)")
          RUNS = re.compile(r"(\d+\.\d+\.\d+)@(sha256:[0-9a-f]{64})/")
          NEXT = re.compile(r'<(?:https://ghcr\.io)?(/v2/[^>]+)>;\s*rel="?next"?')
          ACCEPT = ", ".join(
              "application/vnd." + kind
              for kind in (
                  "oci.image.index.v1+json",
                  "docker.distribution.manifest.list.v2+json",
                  "oci.image.manifest.v1+json",
                  "docker.distribution.manifest.v2+json",
              )
          )
          NONE = "No release of {e} was found at {r}."
          MISSING = "{e} {v} does not exist: check Version, or leave it empty for the newest release."
          KEY = "The download key cannot read {r}: check Qory Apiary Pro download key."
          ANONYMOUS = "{r} cannot be read without a download key that reads it."
          UNREACHABLE = "ghcr.io could not be reached to find the version: update again later."
          OLDER = "Version {v} is older than the {o} the stack runs: Qory Apiary does not go back to an older version."
          NEWER = "{e} {v} needs a newer template: update the stack with the newest apiary.yaml."


          class Refused(Exception):
              pass


          class Denied(Exception):
              pass


          class Missing(Exception):
              pass


          class Unreachable(Exception):
              pass


          # Never follows a redirect: the key or the token would go with it to another host.
          # A 3xx is then an HTTPError.
          class Stay(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *arguments):
                  return None


          OPENER = urllib.request.build_opener(Stay)


          def number(version):
              return tuple(map(int, version.split(".")))


          def call(url, headers, method="GET"):
              try:
                  return OPENER.open(urllib.request.Request(url, headers=headers, method=method), timeout=10)
              except urllib.error.HTTPError as error:
                  if error.code in (401, 403):
                      raise Denied from None
                  if error.code == 404:
                      raise Missing from None
                  if 400 <= error.code < 500:
                      raise
                  raise Unreachable from None
              except OSError:
                  raise Unreachable from None


          def newest(base, headers):
              url, tags = base + "/tags/list?n=1000", []
              for _ in range(100):
                  with call(url, headers) as response:
                      tags += json.load(response).get("tags") or []
                      link = NEXT.search(response.headers.get("Link") or "")
                  if not link:
                      return max((tag for tag in tags if RELEASE.fullmatch(tag)), key=number, default=None)
                  url = "https://ghcr.io" + link[1]
              raise ValueError("more than 100 pages of tags")


          def lookup(event, secrets):
              p = event["ResourceProperties"]
              edition, typed, template = p["Edition"], p["Version"], p["TemplateVersion"]
              repository, secret = p["Repository"], p["DownloadKeySecret"]
              path = repository.removeprefix("ghcr.io/")
              runs = RUNS.match(event.get("PhysicalResourceId", ""))

              def fits(version):
                  if template and number(version)[:2] > number(template)[:2]:
                      raise Refused(NEWER.format(e=edition, v=version))

              if event["RequestType"] == "Update":
                  cloudformation = boto3.client("cloudformation", config=CONFIG)
                  stack = cloudformation.describe_stacks(StackName=os.environ["STACK_ID"])["Stacks"][0]
                  if stack["StackStatus"] == "UPDATE_ROLLBACK_IN_PROGRESS":
                      return runs[1], runs[2], event["PhysicalResourceId"]
              if typed:
                  if not RELEASE.fullmatch(typed):
                      raise Refused(MISSING.format(e=edition, v=typed))
                  if runs and number(typed) < number(runs[1]):
                      raise Refused(OLDER.format(v=typed, o=runs[1]))
                  fits(typed)
              headers = {}
              if secret:
                  value = boto3.client("secretsmanager", config=CONFIG).get_secret_value(SecretId=secret)["SecretString"]
                  key = json.loads(value)
                  basic = base64.b64encode(f"{key['username']}:{key['password']}".encode()).decode()
                  secrets += [key["username"], key["password"], basic]
                  headers["Authorization"] = "Basic " + basic
              try:
                  scope = f"https://ghcr.io/token?service=ghcr.io&scope=repository:{path}:pull"
                  with call(scope, headers) as response:
                      token = json.load(response)["token"]
                  secrets.append(token)
                  headers = {"Authorization": "Bearer " + token, "Accept": ACCEPT}
                  base = "https://ghcr.io/v2/" + path
                  version = typed or newest(base, headers)
                  if not version:
                      raise Missing
                  fits(version)
                  with call(f"{base}/manifests/{version}", headers, "HEAD") as response:
                      digest = response.headers.get("Docker-Content-Digest") or ""
              except Denied:
                  raise Refused((KEY if secret else ANONYMOUS).format(r=repository)) from None
              except Unreachable:
                  raise Refused(UNREACHABLE) from None
              except Missing:
                  raise Refused((MISSING if typed else NONE).format(e=edition, v=typed, r=repository)) from None
              if not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
                  raise ValueError("the registry gave no digest")
              return version, digest, f"{version}@{digest}/{event['RequestId']}"


          def handler(event, context):
              status, reason, data, secrets = "SUCCESS", "", {}, []
              physical = event.get("PhysicalResourceId") or event["LogicalResourceId"]
              try:
                  if event["RequestType"] != "Delete":
                      version, digest, physical = lookup(event, secrets)
                      image = event["ResourceProperties"]["Repository"] + "@" + digest
                      data = {"Version": version, "Image": image, "Digest": digest}
                      print(f"The version is {version}, {image}.")
              except Refused as error:
                  status, reason = "FAILED", str(error)[:1000]
                  print(reason)
              except Exception as error:
                  status, reason = "FAILED", f"See the details in CloudWatch Log Stream: {context.log_stream_name}"
                  text = f"{type(error).__name__}: {error}"
                  for secret in filter(None, secrets):
                      text = text.replace(secret, "***")
                  print(f"The version was not found: {text}"[:1000])

              body = json.dumps(
                  {
                      "Status": status,
                      "Reason": reason or "Done.",
                      "PhysicalResourceId": physical,
                      "StackId": event["StackId"],
                      "RequestId": event["RequestId"],
                      "LogicalResourceId": event["LogicalResourceId"],
                      "Data": data,
                  }
              ).encode()
              request = urllib.request.Request(event["ResponseURL"], data=body, method="PUT", headers={"Content-Type": ""})
              urllib.request.urlopen(request, timeout=10)

  # Made after RegistryCredentials, for Qory Apiary Pro, and before the task definition,
  # which runs the image it found. CloudFormation waits at most ServiceTimeout seconds for
  # the function's answer.
  # [test copy]
  # With Test image, nothing is looked up: the task runs the image Test image names.
  # [/test copy]
  Version:
    Type: Custom::Version
    Condition: LookUpVersion  # [test copy]
    Properties:
      ServiceToken: !GetAtt VersionFunction.Arn
      ServiceTimeout: "360"
      Edition: !Ref Edition
      Repository: !If
        - IsCommunity
        - !FindInMap [Images, Community, Repository]
        - !FindInMap [Images, Pro, Repository]
      DownloadKeySecret: !If [IsCommunity, "", !Ref RegistryCredentials]
      Version: !Ref VersionOverride
      LookForNewerRelease: !Ref LookForNewerRelease
      TemplateVersion: !FindInMap [Template, Release, Version]
      DomainName: !Ref DomainName
      HostedZoneId: !Ref HostedZoneId
      CertificateArn: !Ref CertificateArn
      DatabaseInstanceClass: !Ref DatabaseInstanceClass
      CpuArchitecture: !Ref CpuArchitecture
      KeysFromStack: !Ref KeysFromStack
      DatabaseSnapshot: !Ref DatabaseSnapshot
      AcceptSigningKey: !Ref AcceptSigningKey
      DatabaseDeletionProtection: !Ref DatabaseDeletionProtection
      ErlangOptions: !Ref ErlangOptions

  # Part 1's settings, from the parameters and Secrets Manager. The database's certificate
  # is checked against the RDS bundle the image carries. The image is the one the Version
  # resource found, by its digest, so only a stack create or update changes what runs.
  # [test copy]
  # With Test image, exactly the image it names.
  # [/test copy]
  # APIARY_ACCEPT_SIGNING_FINGERPRINT is set only when Accept a new signing key is, and
  # ELIXIR_ERL_OPTIONS only when Extra Erlang options is.
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "512"
      Memory: "1024"
      RuntimePlatform:
        OperatingSystemFamily: LINUX
        CpuArchitecture: !Ref CpuArchitecture
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: apiary
          Image: !If
            - HasTestImage
            - !Ref TestImage
            - !GetAtt Version.Image
          Essential: true
          PortMappings:
            - ContainerPort: 4100
              Protocol: tcp
          LinuxParameters:
            InitProcessEnabled: true
          RepositoryCredentials: !If
            - HasDownloadKey
            - CredentialsParameter: !Ref RegistryCredentials
            - !Ref AWS::NoValue
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: apiary
          Environment:
            - Name: PUBLIC_URL
              Value: !Sub https://${DomainName}
            - Name: DATABASE_URL
              Value: !Sub postgres://apiary@${Database.Endpoint.Address}:5432/apiary?sslmode=verify-full&sslrootcert=/app/certs/rds-global-bundle.pem
            - Name: TRUSTED_PROXIES
              Value: 10.0.0.0/16
            - !If
              - HasAcceptSigningKey
              - Name: APIARY_ACCEPT_SIGNING_FINGERPRINT
                Value: !Ref AcceptSigningKey
              - !Ref AWS::NoValue
            - !If
              - HasErlangOptions
              - Name: ELIXIR_ERL_OPTIONS
                Value: !Ref ErlangOptions
              - !Ref AWS::NoValue
          # A secret given by name is read from this account and region.
          Secrets:
            - Name: SECRET_KEY_BASE
              ValueFrom: !If [CreateSecrets, !Ref SecretKeyBase, !Sub "${KeysFromStack}/secret-key-base"]
            - Name: APIARY_ENCRYPTION_SECRET
              ValueFrom: !If [CreateSecrets, !Ref EncryptionSecret, !Sub "${KeysFromStack}/encryption-secret"]
            - Name: APIARY_SIGNING_SECRET
              ValueFrom: !If [CreateSecrets, !Ref SigningSecret, !Sub "${KeysFromStack}/signing-secret"]
            - Name: DATABASE_PASSWORD
              ValueFrom: !If [CreateSecrets, !Ref DatabasePassword, !Sub "${KeysFromStack}/database-password"]

  # One task. An upgrade starts the new task beside the old one, which serves until the new
  # one has migrated under Ecto's lock and answers /health; the old release runs on the new
  # schema meanwhile, as migrations written expand/contract allow. A new task that never
  # becomes healthy trips the circuit breaker, which rolls the service back, and the stack
  # update with it. The grace period covers a long migration, during which nothing listens.
  Service:
    Type: AWS::ECS::Service
    DependsOn: [HttpsListener, HttpListener]
    Properties:
      ServiceName: apiary
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: 1
      EnableExecuteCommand: true
      HealthCheckGracePeriodSeconds: 600
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: [!Ref PublicSubnet1, !Ref PublicSubnet2]
          SecurityGroups: [!Ref TaskSecurityGroup]
      LoadBalancers:
        - ContainerName: apiary
          ContainerPort: 4100
          TargetGroupArn: !Ref TargetGroup

  # The stack policy, set by a function in this stack, so nobody has to set it.
  # CloudFormation refuses SetStackPolicy while the stack is in progress, so nothing inside
  # the stack's create or update can set it: no custom resource does. Instead StackPolicyRule,
  # on the account's default event bus, sends the function this stack's status changes
  # to CREATE_COMPLETE, UPDATE_COMPLETE and UPDATE_ROLLBACK_COMPLETE, and the function sets
  # the policy each time: after the create, and after every update, so a policy changed in a
  # later release takes effect once its update completes, and after a rolled-back update,
  # the rolled-back policy. Until the create completes the stack has no policy, and an
  # update runs under the policy set before it. The rule is made during the create, long
  # before the stack completes. The function runs apart from the stack, which never waits on
  # it: a call that fails changes nothing in the stack, and is logged, and Lambda tries the
  # event twice more. Its role may set the policy of this stack and nothing else, and write
  # StackPolicyLogGroup, which is kept as the task's is. Only the rule may invoke it.
  # The runtime is pinned, and kept current with each release.
  StackPolicyLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub
        - /qory/${AWS::StackName}-${StackUuid}/stack-policy
        - StackUuid: !Select [2, !Split ["/", !Ref AWS::StackId]]
      RetentionInDays: 30

  StackPolicyRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: set-stack-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: cloudformation:SetStackPolicy
                Resource: !Ref AWS::StackId
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt StackPolicyLogGroup.Arn

  StackPolicyFunction:
    Type: AWS::Lambda::Function
    Properties:
      Description: Sets the stack's policy each time the stack's create or update completes.
      Runtime: python3.13
      Handler: index.handler
      Role: !GetAtt StackPolicyRole.Arn
      Timeout: 60
      LoggingConfig:
        LogGroup: !Ref StackPolicyLogGroup
      # The function takes the stack and the policy from its environment, never from the
      # event: the policy of deploy/aws/stack-policy.json, which CI keeps the same
      # (scripts/aws-template-check.py policy).
      Environment:
        Variables:
          STACK_ID: !Ref AWS::StackId
          STACK_POLICY: |
            {
              "Statement": [
                {"Effect": "Allow", "Action": "Update:*", "Principal": "*", "Resource": "*"},
                {
                  "Effect": "Deny",
                  "Action": ["Update:Replace", "Update:Delete"],
                  "Principal": "*",
                  "Resource": [
                    "LogicalResourceId/Database",
                    "LogicalResourceId/SecretKeyBase",
                    "LogicalResourceId/EncryptionSecret",
                    "LogicalResourceId/SigningSecret",
                    "LogicalResourceId/DatabasePassword"
                  ]
                }
              ]
            }
      # The event is checked again: this stack, and a status it may act on. A call takes at
      # worst about 42 seconds, under the 60 of its timeout: two tries of at most 5 + 15
      # seconds with a back-off of at most 2 between them. A failed call is logged and
      # raised, so Lambda tries the event again; the stack is long done with it.
      Code:
        ZipFile: |
          import os

          import boto3
          from botocore.config import Config

          COMPLETE = {"CREATE_COMPLETE", "UPDATE_COMPLETE", "UPDATE_ROLLBACK_COMPLETE"}


          def handler(event, context):
              detail = event.get("detail") or {}
              stack = detail.get("stack-id")
              status = (detail.get("status-details") or {}).get("status")
              if stack != os.environ["STACK_ID"] or status not in COMPLETE:
                  print(f"Ignored: the status {status} of the stack {stack}.")
                  return
              config = Config(
                  connect_timeout=5,
                  read_timeout=15,
                  retries={"total_max_attempts": 2, "mode": "standard"},
              )
              try:
                  boto3.client("cloudformation", config=config).set_stack_policy(
                      StackName=os.environ["STACK_ID"],
                      StackPolicyBody=os.environ["STACK_POLICY"],
                  )
              except Exception as error:
                  print(f"The stack policy was not set at {status}: {error}"[:1000])
                  raise
              print(f"The stack policy was set at {status}.")

  # This stack's status changes, as CloudFormation sends them to the default event bus,
  # to the three statuses the function acts on; any other is never sent to it.
  StackPolicyRule:
    Type: AWS::Events::Rule
    Properties:
      Description: Sends the stack's completed creates and updates to the function that sets its policy.
      State: ENABLED
      EventPattern:
        source: [aws.cloudformation]
        detail-type: [CloudFormation Stack Status Change]
        detail:
          stack-id: [!Ref AWS::StackId]
          status-details:
            status: [CREATE_COMPLETE, UPDATE_COMPLETE, UPDATE_ROLLBACK_COMPLETE]
      Targets:
        - Id: stack-policy
          Arn: !GetAtt StackPolicyFunction.Arn

  # The rule, and nothing else, may invoke the function.
  StackPolicyPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt StackPolicyFunction.Arn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt StackPolicyRule.Arn

  # The database's deletion protection, set by a function in this stack once the
  # service is healthy: DatabaseProtection is made after the service, whose create waits
  # until its task answers /health. A create that fails before then leaves the database
  # unprotected, so the rollback deletes it with the rest. On Create, and on each Update,
  # DatabaseDeletionProtection changed, the database replaced or an update rolled back, the
  # function sets the protection to the value the request gives it, in place, on the
  # database its environment names; a request that names another database fails. On Delete
  # it changes nothing, so deleting the stack with the protection on still fails at the
  # database; only while the stack's create rolls back does it turn the protection off, so
  # that rollback can delete the database too. It answers CloudFormation even when its call
  # fails, and a request that names another stack fails and changes nothing. Its role may
  # read and modify this database alone, read this stack, and write
  # DatabaseProtectionLogGroup, which is kept as the task's is. The runtime is pinned, and
  # kept current with each release.
  DatabaseProtectionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub
        - /qory/${AWS::StackName}-${StackUuid}/database-protection
        - StackUuid: !Select [2, !Split ["/", !Ref AWS::StackId]]
      RetentionInDays: 30

  DatabaseProtectionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: database-deletion-protection
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - rds:DescribeDBInstances
                  - rds:ModifyDBInstance
                Resource: !Sub arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:db:${Database}
              - Effect: Allow
                Action: cloudformation:DescribeStacks
                Resource: !Ref AWS::StackId
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt DatabaseProtectionLogGroup.Arn

  DatabaseProtectionFunction:
    Type: AWS::Lambda::Function
    Properties:
      Description: Sets the database's deletion protection once the service is healthy.
      Runtime: python3.13
      Handler: index.handler
      Role: !GetAtt DatabaseProtectionRole.Arn
      Timeout: 600
      LoggingConfig:
        LogGroup: !Ref DatabaseProtectionLogGroup
      # The function takes the stack and the database from its environment, never from the
      # request. The request gives whether to protect, and names the database only so that a
      # replaced database sends an Update: the function acts only when that name is the one
      # in its environment.
      Environment:
        Variables:
          STACK_ID: !Ref AWS::StackId
          DATABASE: !Ref Database
      # A database busy with a backup or another change refuses the change; it is asked
      # again every 20 seconds while at least 120 of the 600 are left. A call takes at most
      # about 42 seconds (two tries of 5 + 15, a back-off of at most 2 between them), so
      # the last round, the answer's 10 included, ends inside the timeout.
      Code:
        ZipFile: |
          import json
          import os
          import time
          import urllib.request

          import boto3
          from botocore.config import Config

          CONFIG = Config(
              connect_timeout=5,
              read_timeout=15,
              retries={"total_max_attempts": 2, "mode": "standard"},
          )


          def protect(rds, database, wanted, context):
              while True:
                  instance = rds.describe_db_instances(DBInstanceIdentifier=database)["DBInstances"][0]
                  if instance["DeletionProtection"] == wanted:
                      return
                  try:
                      rds.modify_db_instance(DBInstanceIdentifier=database, DeletionProtection=wanted)
                      return
                  except rds.exceptions.InvalidDBInstanceStateFault:
                      if context.get_remaining_time_in_millis() < 120_000:
                          raise
                      time.sleep(20)


          def handler(event, context):
              status, reason = "SUCCESS", ""
              try:
                  if event["StackId"] != os.environ["STACK_ID"]:
                      raise ValueError(f"the request names another stack, {event['StackId']}")
                  rds = boto3.client("rds", config=CONFIG)
                  database = os.environ["DATABASE"]
                  if event["RequestType"] in ("Create", "Update"):
                      named = event["ResourceProperties"]["Database"]
                      if named != database:
                          raise ValueError(f"the request names the database {named}, not {database}")
                      wanted = event["ResourceProperties"]["DeletionProtection"] == "true"
                      protect(rds, database, wanted, context)
                  else:
                      stack = boto3.client("cloudformation", config=CONFIG).describe_stacks(
                          StackName=os.environ["STACK_ID"]
                      )["Stacks"][0]
                      # A create rolling back: the database goes too, so nothing may hold it.
                      if stack["StackStatus"] == "ROLLBACK_IN_PROGRESS":
                          try:
                              protect(rds, database, False, context)
                          except rds.exceptions.DBInstanceNotFoundFault:
                              pass
              except Exception as error:
                  status, reason = "FAILED", f"The database's deletion protection was not set: {error}"[:1000]
                  print(reason)

              # Always answered, so the stack never waits on a function that failed.
              body = json.dumps(
                  {
                      "Status": status,
                      "Reason": reason or "Done.",
                      "PhysicalResourceId": event.get("PhysicalResourceId") or "database-protection",
                      "StackId": event["StackId"],
                      "RequestId": event["RequestId"],
                      "LogicalResourceId": event["LogicalResourceId"],
                  }
              ).encode()
              request = urllib.request.Request(
                  event["ResponseURL"], data=body, method="PUT", headers={"Content-Type": ""}
              )
              urllib.request.urlopen(request, timeout=10)

  # Made after the service, so once its task is healthy. Its setting is
  # DatabaseDeletionProtection's. It names the database too, so that a replaced database
  # sends it an Update, after the function's role and environment have moved to the new
  # one (each refers to Database, and DatabaseProtection to the function), and the new
  # database is protected as the old one was. CloudFormation waits at most ServiceTimeout
  # seconds for the function's answer.
  DatabaseProtection:
    Type: Custom::DatabaseProtection
    DependsOn: Service
    Properties:
      ServiceToken: !GetAtt DatabaseProtectionFunction.Arn
      ServiceTimeout: "660"
      Database: !Ref Database
      DeletionProtection: !If [ProtectDatabase, "true", "false"]

# Links into the AWS console, and the values a person reads; no output is a command (CI
# checks it: scripts/aws-template-check.py outputs).
Outputs:
  Url:
    Description: Qory Apiary's address.
    Value: !Sub https://${DomainName}
  LoadBalancerDnsName:
    Description: Point the domain here with a CNAME when no hosted zone was given.
    Value: !GetAtt LoadBalancer.DNSName
  Edition:
    Description: The edition the stack runs.
    Value: !Ref Edition
  # The version and the image the Version resource found.
  # [test copy]
  # With Test image, the image the stack runs in place of a version.
  # [/test copy]
  Version:
    Description: The version the stack runs.
    Value: !If
      - HasTestImage
      - !Sub "Test image ${TestImage}"
      - !GetAtt Version.Version
  Image:
    Description: The image the stack runs, by its digest.
    Value: !If
      - HasTestImage
      - !Ref TestImage
      - !GetAtt Version.Image
  Logs:
    Description: The task's log group in CloudWatch, kept 30 days.
    Value: !Sub
      - https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#logsV2:log-groups/log-group/$252Fqory$252F${AWS::StackName}-${StackUuid}
      - StackUuid: !Select [2, !Split ["/", !Ref AWS::StackId]]
  # Until Qory Apiary is set up, each start of the task logs "Set up Qory Apiary at
  # https://<domain>/setup/<code>." in the log group Logs links to. The link opens that log
  # group's events filtered to "/setup/", the console's filterPattern escaped as the Logs
  # link escapes the group's name. The filter is a convenience: the log group is the source,
  # and without it the line is found by searching the group for /setup/.
  SetUp:
    Description: The set-up link is in the log; open it once.
    Value: !Sub
      - https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#logsV2:log-groups/log-group/$252Fqory$252F${AWS::StackName}-${StackUuid}/log-events$3FfilterPattern$3D$2522$252Fsetup$252F$2522
      - StackUuid: !Select [2, !Split ["/", !Ref AWS::StackId]]
  Service:
    Description: The service's health and events in ECS.
    Value: !Sub https://${AWS::Region}.console.aws.amazon.com/ecs/v2/clusters/${Cluster}/services/${Service.Name}/health?region=${AWS::Region}
  KeysSecrets:
    Description: The key secrets, kept when the stack is deleted, to copy apart from the database's backups.
    Value: !If
      - CreateSecrets
      - !Join [",", [!Ref SecretKeyBase, !Ref EncryptionSecret, !Ref SigningSecret, !Ref DatabasePassword]]
      - !Sub ${KeysFromStack}/secret-key-base,${KeysFromStack}/encryption-secret,${KeysFromStack}/signing-secret,${KeysFromStack}/database-password
  KeysSecretsLink:
    Description: The keys needed to restore this instance's data, in AWS Secrets Manager.
    Value: !Sub
      - https://${AWS::Region}.console.aws.amazon.com/secretsmanager/listsecrets?region=${AWS::Region}&search=all%3D${Prefix}%2F
      - Prefix: !If
          - CreateSecrets
          - !Sub
            - ${AWS::StackName}-${StackUuid}
            - StackUuid: !Select [2, !Split ["/", !Ref AWS::StackId]]
          - !Ref KeysFromStack
  DatabaseSnapshots:
    Description: "The RDS console's database snapshots in this region. A deleted stack's final database snapshot is listed there."
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/rds/home?region=${AWS::Region}#snapshots-list:"
