# A checkout that extends a stack and appends a module from a remote source.
harness:
  extends: {git: https://code.example.com/example-org/harness, ref: v2.4.0, path: stacks/web}
  modules:
    - source:
        git: https://code.example.com/example-org/modules
        ref: v1.0.0
        path: modules/review
      variant: claude
