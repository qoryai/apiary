apiVersion: qory.dev/v1alpha1
name: Software factory
summary: Agents change code in your repositories. Each ticket needs a repository.
description: |-
  Each ticket comes from a work source, such as an issue tracker. Agents take the ticket through the stages, and at the end of each stage a member approves the result before the next stage starts. Changes go to your repositories through the destination you connect.

  You connect: where work comes from, where changes go, and a model.
type: qory.software
stack: software
process:
  schema: qory.process/v1
  machine: default
  stages:
    - id: st_r79kph11eg
      name: Explore
      inputs: []
      sequence:
        - workflow: explore-a-ticket
      outputs:
        - type: proposal
          required: true
      gate: {kind: person, approvers: members}
    - id: st_p9w5cvh311
      name: Shape
      inputs: []
      sequence: []
      outputs: []
      gate: {kind: person, approvers: members}
    - id: st_6ns22c4pav
      name: Build
      inputs: []
      sequence: []
      outputs: []
      gate: {kind: person, approvers: members}
    - id: st_m1mqbeywdg
      name: Verify
      inputs: []
      sequence: []
      outputs: []
      gate: {kind: person, approvers: members}
    - id: st_k9kpv17xmy
      name: Release
      inputs: []
      sequence: []
      outputs: []
      gate: {kind: person, approvers: members}
artifact_types:
  - name: acceptance-criteria
  - name: verification
  - name: mockup
  - name: screenshot
  - name: demo-video
  - name: walkthrough
  - name: decision-record
  - name: submission
    base_view: structured
    size_limit: 1048576
    max_files: 1
    # The same JSON Schema is in running-a-software-workflow/schemas/submission.schema.json.
    json_schema:
      {
        "$schema": "https://json-schema.org/draft/2020-12/schema",
        "title": "Submission, version 1",
        "description": "A session's branch, commits, draft, text and verdict.",
        "type": "object",
        "required": [
          "ref",
          "repositories",
          "verdict"
        ],
        "additionalProperties": false,
        "properties": {
          "ref": {
            "title": "Branch",
            "type": "string",
            "pattern": "^qory/wi_[A-Za-z0-9_-]{1,64}$"
          },
          "verdict": {
            "enum": [
              "passed",
              "changes-requested",
              "escalate",
              "none"
            ]
          },
          "repositories": {
            "type": "array",
            "minItems": 1,
            "maxItems": 20,
            "items": {
              "$ref": "#/$defs/repository"
            }
          },
          "text": {
            "$ref": "#/$defs/text"
          }
        },
        "$defs": {
          "repository": {
            "type": "object",
            "required": [
              "system",
              "path",
              "commit",
              "draft"
            ],
            "additionalProperties": false,
            "properties": {
              "system": {
                "type": "string",
                "pattern": "^[a-z0-9.-]{0,252}[a-z0-9-]$"
              },
              "path": {
                "type": "string",
                "maxLength": 200,
                "pattern": "^[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*$",
                "not": {
                  "pattern": "(^|/)(\\.\\.?|\\.[Gg][Ii][Tt])(/|$)"
                }
              },
              "commit": {
                "title": "Commit",
                "$ref": "#/$defs/commit"
              },
              "commit_url": {
                "title": "Commit link",
                "type": "string",
                "maxLength": 2048,
                "pattern": "^https://\\S+$"
              },
              "draft": {
                "oneOf": [
                  {
                    "$ref": "#/$defs/draft"
                  },
                  {
                    "$ref": "#/$defs/no_draft"
                  }
                ]
              }
            }
          },
          "draft": {
            "type": "object",
            "required": [
              "number",
              "url",
              "title",
              "state",
              "action"
            ],
            "additionalProperties": false,
            "properties": {
              "number": {
                "title": "Draft",
                "type": "integer",
                "minimum": 1
              },
              "url": {
                "title": "Draft link",
                "type": "string",
                "maxLength": 2048,
                "pattern": "^https://\\S+$"
              },
              "title": {
                "title": "Draft title",
                "type": "string",
                "minLength": 1,
                "maxLength": 256,
                "pattern": "^[^\\x00-\\x1f\\x7f]+$"
              },
              "state": {
                "enum": [
                  "draft",
                  "open"
                ]
              },
              "action": {
                "enum": [
                  "opened",
                  "updated",
                  "kept"
                ]
              }
            }
          },
          "no_draft": {
            "type": "object",
            "required": [
              "none"
            ],
            "additionalProperties": false,
            "properties": {
              "none": {
                "title": "No draft",
                "enum": [
                  "not-passed",
                  "no-text",
                  "escalated",
                  "no-program"
                ]
              }
            }
          },
          "text": {
            "type": "object",
            "required": [
              "title",
              "description"
            ],
            "additionalProperties": false,
            "properties": {
              "title": {
                "type": "string",
                "minLength": 1,
                "maxLength": 256,
                "pattern": "^[^\\n]+$"
              },
              "description": {
                "type": "string",
                "minLength": 1,
                "maxLength": 16384
              }
            }
          },
          "commit": {
            "type": "string",
            "pattern": "^([0-9a-f]{40}|[0-9a-f]{64})$"
          }
        }
      }
