name: End to end

# Live reload, end to end (e2e/README.md): a session behind a Docker wall on a Linux
# node, refused a host, allowed from the console, let through within the budget.

on:
  push:
    branches: [main, next]
  pull_request:
  workflow_dispatch:

# A newer push to a pull request cancels its run in progress. A push to next or main, and a
# manual run, are each a group of their own, the run's, so no later push cancels its run,
# in progress or waiting, and the head of every push to them is checked.
concurrency:
  group: e2e-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  live-reload:
    # A pull request whose head is next, of this repository, skips the job: the push to
    # next runs it on the same commit. GitHub does not evaluate the name of a job its if
    # skips: the skipped job's check shows its name: expression as written, which is never
    # a required check's name, so a required check is answered only by the push run's job
    # on that commit. The push run's job carries the readable name. A fork's branch named
    # next is not this repository's.
    name: "${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'next') && 'Live reload behind a wall · checked by the push run' || 'Live reload behind a wall' }}"
    if: ${{ !(github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'next') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: ghcr.io/qoryai/ci-images:postgres-18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      # The images this job pulls are qoryai's copies of them in ghcr.io/qoryai/ci-images,
      # pulled by digest as this job, with its own token, and not without a login from an
      # address GitHub's runners share, which registries limit.
      - name: Log in to ghcr.io
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      # The node's command is built from source: qory at the ref in .qory-e2e-ref, against
      # Forager at the ref in .forager-e2e-ref, the Forager that qory is written for. The
      # whole history is fetched, so a ref may be a tag, a branch or a short commit id. Both
      # live outside the workspace's tracked files, under tmp/.
      - name: Fetch Forager's repository
        uses: actions/checkout@v7
        with:
          repository: qoryai/forager
          path: tmp/forager
          fetch-depth: 0
          token: ${{ secrets.FORAGER_REPOSITORY_TOKEN || github.token }}

      - name: Fetch qory's repository
        uses: actions/checkout@v7
        with:
          repository: qoryai/qory
          path: tmp/qory
          fetch-depth: 0
          token: ${{ secrets.FORAGER_REPOSITORY_TOKEN || github.token }}

      - name: Check out the pinned refs
        run: |
          git -C tmp/forager checkout --detach "$(grep -v '^#' .forager-e2e-ref | head -n 1 | tr -d '[:space:]')"
          git -C tmp/qory checkout --detach "$(grep -v '^#' .qory-e2e-ref | head -n 1 | tr -d '[:space:]')"

      - name: Install the toolchain pinned in mise.toml
        uses: jdx/mise-action@v3

      - name: Install the Go qory is built with
        uses: actions/setup-go@v6
        with:
          go-version-file: tmp/qory/go.mod
          cache-dependency-path: tmp/qory/go.sum

      - name: Restore dependencies and build
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: mix-e2e-${{ runner.os }}-${{ hashFiles('mise.toml', 'mix.lock') }}
          restore-keys: |
            mix-e2e-${{ runner.os }}-

      - name: Fetch dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      # The wall's image, curlimages/curl:8.16.0 in e2e/run.sh, is CI's copy of it, put under
      # that name so that the job finds it and pulls nothing.
      - name: Put CI's copy of the wall's image under the job's name for it
        run: |
          docker pull --quiet ghcr.io/qoryai/ci-images:curl-8.16.0@sha256:463eaf6072688fe96ac64fa623fe73e1dbe25d8ad6c34404a669ad3ce1f104b6
          docker tag ghcr.io/qoryai/ci-images:curl-8.16.0@sha256:463eaf6072688fe96ac64fa623fe73e1dbe25d8ad6c34404a669ad3ce1f104b6 curlimages/curl:8.16.0

      - name: Run the job
        env:
          QORY_SRC: ${{ github.workspace }}/tmp/qory
          FORAGER_SRC: ${{ github.workspace }}/tmp/forager
          E2E_DATABASE_URL: ecto://postgres:postgres@localhost:5432/apiary_e2e
        run: e2e/run.sh

      # What the job printed and what the session printed. The access key's secret, in
      # access-key-secret beside the Forager file, is removed by the job and is not among
      # them.
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-logs
          path: |
            tmp/e2e/run-*.log
            tmp/e2e/session-*.log
          if-no-files-found: ignore
