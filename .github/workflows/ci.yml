name: CI

on:
  push:
    branches: [main, next]
  pull_request:

# A newer push to a pull request cancels its run in progress. A push to next or main is a
# group of its own, the run's, so no later push cancels its run, in progress or waiting,
# and the head of every push to them is checked.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Four jobs side by side: Checks, the checks that do not depend on the features, run once;
# the tests, under each set of features; the image, on each platform; and Database over TLS.
#
# A pull request whose head is next, of this repository, skips them: the push to next runs
# them on the same commit, the pull request's head. GitHub does not evaluate the name of a
# job its if skips: the skipped job's check shows its name: expression as written, which is
# never a required check's name, so a required check is answered only by the push run's job
# on that commit. The push run's jobs carry the readable names. A fork's branch named next
# is not this repository's, and its pull request runs them.
jobs:
  checks:
    name: "${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'next') && 'Checks · checked by the push run' || 'Checks' }}"
    if: ${{ !(github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'next') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install the toolchain pinned in mise.toml
        uses: jdx/mise-action@v3

      # The job's own cache, apart from the tests': the dependencies, the dev and prod
      # builds the checks and the assets compile, and the Tailwind binary. Not esbuild's:
      # its file carries no version, so a cached one would outlive a change of version.
      - name: Restore dependencies and build
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build/dev
            _build/prod
            _build/tailwind-*
          key: mix-checks-${{ runner.os }}-${{ hashFiles('mise.toml', 'mix.lock') }}
          restore-keys: |
            mix-checks-${{ runner.os }}-

      - name: Fetch dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile without warnings
        run: mix compile --warnings-as-errors

      - name: Check the Gettext catalogues are extracted
        run: mix gettext.extract --check-up-to-date

      # The hooks' own tests, under Node's test runner and its WebCrypto, with no npm: the
      # key a browser makes against the contract's known answer, and what it sends Qory.
      - name: Test the browser scripts
        run: node --test 'assets/js/test/*.test.mjs'

      - name: Build the documentation without warnings
        run: mix docs --warnings-as-errors

      - name: Build the assets
        env:
          MIX_ENV: prod
        run: mix assets.deploy

      # The AWS template, deploy/aws/apiary.yaml: cfn-lint, at the version pinned here, in
      # a virtual environment of its own; scripts/aws-template-check.py reads the template
      # with cfn-lint's decoder.
      - name: Install cfn-lint
        run: |
          python3 -m venv "$RUNNER_TEMP/cfn-lint"
          "$RUNNER_TEMP/cfn-lint/bin/pip" install --quiet cfn-lint==1.57.0
          echo "$RUNNER_TEMP/cfn-lint/bin" >> "$GITHUB_PATH"

      - name: Lint the AWS template
        run: cfn-lint deploy/aws/apiary.yaml

      # Every resource stack-policy.json names is the template's, the database and the four
      # key secrets are all guarded, and the ProtectCommand output sets the same policy.
      - name: Check the stack policy against the template
        run: python scripts/aws-template-check.py policy

      # update-stack resets every parameter it is not given to its default, DatabaseSnapshot
      # included, which replaces a restored database with an empty one. The guides name
      # aws cloudformation deploy and the console's Update, which keep them.
      - name: Check no guide names update-stack
        run: |
          if grep -rn 'update-stack' guides docs README.md; then
            echo "a guide names update-stack; name aws cloudformation deploy or the console's Update" >&2
            exit 1
          fi

      # A changed property can replace a secret, and a replaced secret is generated anew, so
      # the five secrets stay as the previous release's template has them. The previous
      # release is the repository's latest, as GitHub names it (the newest that is neither a
      # draft nor a prerelease), and its template the apiary.yaml attached to it. With no
      # release, or a release without one, there is nothing to compare with.
      - name: Check the secrets against the previous release's template
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>"$RUNNER_TEMP/release.err"); then
            grep -q 'HTTP 404' "$RUNNER_TEMP/release.err" || { cat "$RUNNER_TEMP/release.err" >&2; exit 1; }
            echo "::notice::No release yet: the template's secrets have no previous release to compare with."
            exit 0
          fi
          assets=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          if ! grep -qx apiary.yaml <<< "$assets"; then
            echo "::notice::Release $tag has no apiary.yaml attached: the template's secrets have nothing to compare with."
            exit 0
          fi
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern apiary.yaml --dir "$RUNNER_TEMP/previous"
          python scripts/aws-template-check.py secrets "$RUNNER_TEMP/previous/apiary.yaml"

  test:
    name: "${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'next') && 'Elixir tests · checked by the push run' || format('Elixir tests ({0})', matrix.name) }}"
    if: ${{ !(github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'next') }}
    runs-on: ubuntu-latest
    # The suite runs under each instance a launch may make: every feature, the opt-in
    # ones included (QORY_FEATURES unset or empty, which the tests take for every
    # feature); the default features, as `all` gives them to an instance; and the record
    # alone. A test that exercises a feature is tagged `needs:` and left out where the
    # feature is off. A test tagged `with_features:` runs under the features it names,
    # whatever the leg's, so it runs once, in the "every feature" leg (test/test_helper.exs).
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: every feature
            features: ""
          - name: the default features
            features: all
          - name: the record alone
            features: observability
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      # The fixtures of the server contract live in Forager's repository; the tests
      # tagged :contract replay them, at the ref pinned in .forager-contract-ref.
      # The whole history is fetched, so the ref may be a tag, a branch or a short commit id.
      - name: Fetch Forager's repository
        uses: actions/checkout@v7
        with:
          repository: qoryai/forager
          path: tmp/forager
          fetch-depth: 0
          token: ${{ secrets.FORAGER_REPOSITORY_TOKEN || github.token }}

      - name: Check out the pinned ref of Forager's contract
        run: git -C tmp/forager checkout --detach "$(grep -v '^#' .forager-contract-ref | head -n 1 | tr -d '[:space:]')"

      - name: Install the toolchain pinned in mise.toml
        uses: jdx/mise-action@v3

      # The legs compile the same build, as QORY_FEATURES is read when the suite runs and
      # not when it compiles: each restores the tests' cache, and "every feature" alone
      # saves it, so no leg's save races another's.
      - name: Restore dependencies and build
        id: restore
        uses: actions/cache/restore@v6
        with:
          path: |
            deps
            _build/test
          key: mix-test-${{ runner.os }}-${{ hashFiles('mise.toml', 'mix.lock') }}
          restore-keys: |
            mix-test-${{ runner.os }}-

      - name: Fetch dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: Test
        env:
          MIX_ENV: test
          FORAGER_CONTRACT_DIR: ${{ github.workspace }}/tmp/forager/contracts/forager/v1
          CONTRACT_FIXTURES_REQUIRED: "1"
          QORY_FEATURES: ${{ matrix.features }}
        run: mix test

      - name: Save dependencies and build
        if: matrix.features == '' && steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            deps
            _build/test
          key: ${{ steps.restore.outputs.cache-primary-key }}

  # The image, from the Dockerfile, for each platform a release publishes, each built on a
  # runner of its own architecture: built and checked, and pushed to no registry. Only
  # release.yml publishes an image, at a release, with the same build: the same labels,
  # build argument and cache.
  image:
    name: "${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'next') && 'Image · checked by the push run' || format('Image ({0})', matrix.platform) }}"
    if: ${{ !(github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'next') }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Loaded into the runner's Docker for the checks below, under a name that is not the
      # package's. The cache is the platform's own, which release.yml builds on too.
      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: apiary:ci
          build-args: |
            APIARY_REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.arch }}

      # The keys directory belongs to nobody, the release carries the commit it was built
      # from, and RDS's certificate bundle is the one the Dockerfile pins.
      - name: Check the image
        run: |
          docker run --rm apiary:ci ls -ld /var/lib/apiary/keys
          owner="$(docker run --rm apiary:ci stat -c %U /var/lib/apiary/keys)"
          [ "$owner" = nobody ] || {
            echo "/var/lib/apiary/keys belongs to $owner, not nobody" >&2; exit 1; }

          revision="$(docker run --rm apiary:ci cat /app/REVISION)"
          [ "$revision" = "$GITHUB_SHA" ] || {
            echo "/app/REVISION holds $revision, not $GITHUB_SHA" >&2; exit 1; }

          pinned="$(grep -o 'checksum=sha256:[0-9a-f]*' Dockerfile | cut -d: -f2)"
          [ -n "$pinned" ] || { echo "the Dockerfile pins no checksum" >&2; exit 1; }
          echo "$pinned  /app/certs/rds-global-bundle.pem" |
            docker run --rm -i apiary:ci sha256sum -c -

  # DATABASE_URL's sslmode and sslrootcert (Apiary.DatabaseUrl) against a Postgres 18 that
  # serves TLS: a CA and a certificate for localhost are made for the run, in the runner's
  # temporary directory, and the CAs' keys deleted once the certificate is signed.
  # verify-full with sslrootcert naming that CA connects over TLS; another CA, another host
  # name and the system's CAs are refused; require connects without checking; disable
  # connects without TLS. The tests' own database is the service, as in the tests' job.
  database-tls:
    name: "${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'next') && 'Database over TLS · checked by the push run' || 'Database over TLS' }}"
    if: ${{ !(github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'next') }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TLS_CONTAINER: apiary-database-tls-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7

      - name: Install the toolchain pinned in mise.toml
        uses: jdx/mise-action@v3

      # The tests' cache, read only: the tests' job saves it.
      - name: Restore dependencies and build
        uses: actions/cache/restore@v6
        with:
          path: |
            deps
            _build/test
          key: mix-test-${{ runner.os }}-${{ hashFiles('mise.toml', 'mix.lock') }}
          restore-keys: |
            mix-test-${{ runner.os }}-

      - name: Fetch dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: Make a CA, another CA and a certificate for localhost
        run: |
          tls_dir="$RUNNER_TEMP/database-tls"
          mkdir -p "$tls_dir" && cd "$tls_dir"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=Apiary test CA" \
            -keyout ca.key -out ca.pem
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=Apiary other CA" \
            -keyout wrong-ca.key -out wrong-ca.pem
          openssl req -newkey rsa:2048 -nodes -subj "/CN=localhost" \
            -keyout server.key -out server.csr
          printf '%s\n' "subjectAltName=DNS:localhost" "basicConstraints=CA:FALSE" \
            "extendedKeyUsage=serverAuth" > server.ext
          openssl x509 -req -in server.csr -CA ca.pem -CAkey ca.key -CAcreateserial -days 1 \
            -extfile server.ext -out server.crt
          rm ca.key wrong-ca.key server.csr
          echo "DATABASE_TLS_CA=$tls_dir/ca.pem" >> "$GITHUB_ENV"
          echo "DATABASE_TLS_WRONG_CA=$tls_dir/wrong-ca.pem" >> "$GITHUB_ENV"

      # Postgres reads its key only when the key is its own and private, so the container
      # copies the mounted files to where they are before Postgres starts. The password is
      # the run's own, and reaches the tests in DATABASE_PASSWORD's place.
      - name: Start Postgres 18 with TLS
        run: |
          tls_dir="$RUNNER_TEMP/database-tls"
          password=$(openssl rand -hex 16)
          echo "::add-mask::$password"
          echo "DATABASE_TLS_PASSWORD=$password" >> "$GITHUB_ENV"
          docker run -d --name "$TLS_CONTAINER" -e POSTGRES_PASSWORD="$password" \
            -p 127.0.0.1::5432 \
            -v "$tls_dir/server.crt:/tls/server.crt:ro" -v "$tls_dir/server.key:/tls/server.key:ro" \
            postgres:18 bash -c '
              install -D -o postgres -g postgres -m 0644 /tls/server.crt /etc/postgresql-tls/server.crt &&
              install -o postgres -g postgres -m 0600 /tls/server.key /etc/postgresql-tls/server.key &&
              exec docker-entrypoint.sh postgres -c ssl=on \
                -c ssl_cert_file=/etc/postgresql-tls/server.crt \
                -c ssl_key_file=/etc/postgresql-tls/server.key'
          echo "DATABASE_TLS_PORT=$(docker port "$TLS_CONTAINER" 5432/tcp | head -n 1 | cut -d: -f2)" >> "$GITHUB_ENV"
          for _ in $(seq 60); do
            docker exec "$TLS_CONTAINER" pg_isready -U postgres -h localhost && break
            sleep 1
          done
          docker exec "$TLS_CONTAINER" psql -U postgres -tAc 'SHOW ssl' | grep -qx on

      - name: Test
        env:
          MIX_ENV: test
        run: mix test --only database_tls

      - name: Remove the Postgres with TLS
        if: always()
        run: docker rm -f "$TLS_CONTAINER"
