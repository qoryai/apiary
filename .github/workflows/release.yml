name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# A tag vX.Y.Z publishes the image ghcr.io/qoryai/apiary as X.Y.Z, X.Y and latest, for
# linux/amd64 and linux/arm64, and the GitHub release with compose.yaml, env.example and
# apiary.yaml attached: env.example a copy of .env.example naming X.Y.Z in APIARY_VERSION,
# apiary.yaml a copy of the AWS template, deploy/aws/apiary.yaml, naming X.Y.Z as Apiary
# Community's version, which scripts/aws-template-release.py writes in. The image's build is
# ci.yml's: the same labels, build argument and cache. Nothing else publishes an image, or
# the template.
#
# env.example has no leading period: GitHub renames asset names with a leading period.
jobs:
  check:
    name: Check the tag
    # Releases are published from the GitHub mirror, where the image is pulled from.
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag against mix.exs
        id: version
        # The release reports the version in mix.exs, so the tag has to be that version.
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -q "version: \"$version\"" mix.exs || {
            echo "mix.exs does not carry version $version" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check the changelog has the release's section
        # A tag without a section in CHANGELOG.md does not publish.
        run: scripts/changelog-section.sh "${GITHUB_REF_NAME#v}" release-notes.md

      - name: Check the files the release attaches
        # The release attaches a copy of .env.example as env.example, naming the version in
        # the one APIARY_VERSION= line the repository's .env.example leaves empty.
        run: |
          test -f compose.yaml || { echo "compose.yaml is missing" >&2; exit 1; }
          [ "$(grep -cx 'APIARY_VERSION=' .env.example)" = 1 ] || {
            echo ".env.example has no single empty APIARY_VERSION= line to write env.example from" >&2; exit 1; }

      - name: Check the template the release publishes
        # The release writes the version into a copy of the template, whose Release mapping
        # in the repository names none; the script refuses a template it cannot write
        # every place of exactly once.
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          test -f deploy/aws/stack-policy.json || { echo "deploy/aws/stack-policy.json is missing" >&2; exit 1; }
          cp deploy/aws/apiary.yaml "$RUNNER_TEMP/apiary.yaml"
          python3 scripts/aws-template-release.py "$RUNNER_TEMP/apiary.yaml" \
            --edition-default "Apiary Community" --community-version "$VERSION" --pro-version ""

  # Each platform on a runner of its own architecture, pushed by digest alone: no tag
  # names an image until both are built.
  image:
    name: Build the image (${{ matrix.platform }})
    needs: check
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            APIARY_REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.version=${{ needs.check.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.arch }}

      - name: Keep the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish the image and the release
    needs: [check, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One manifest for both platforms, under X.Y.Z, X.Y and latest, without the v.
      - name: Tag the image
        working-directory: digests
        run: |
          sources=()
          for digest in *; do sources+=("${IMAGE}@sha256:${digest}"); done
          [ "${#sources[@]}" = 2 ] || { echo "expected 2 digests, got ${#sources[@]}" >&2; exit 1; }
          docker buildx imagetools create \
            --tag "${IMAGE}:${VERSION}" \
            --tag "${IMAGE}:${VERSION%.*}" \
            --tag "${IMAGE}:latest" \
            "${sources[@]}"
          docker buildx imagetools inspect "${IMAGE}:${VERSION}"

      - name: Take the release body from the changelog
        run: scripts/changelog-section.sh "$VERSION" release-notes.md

      - name: Write the files the release attaches
        run: |
          mkdir dist
          cp compose.yaml dist/compose.yaml
          sed "s/^APIARY_VERSION=\$/APIARY_VERSION=$VERSION/" .env.example > dist/env.example
          grep -qx "APIARY_VERSION=$VERSION" dist/env.example
          cp deploy/aws/apiary.yaml dist/apiary.yaml
          python3 scripts/aws-template-release.py dist/apiary.yaml \
            --edition-default "Apiary Community" --community-version "$VERSION" --pro-version ""
          grep -qx "      CommunityVersion: \"$VERSION\"" dist/apiary.yaml
          cp deploy/aws/stack-policy.json dist/stack-policy.json

      # The template job publishes these same files to S3.
      - uses: actions/upload-artifact@v7
        with:
          name: aws-template
          path: |
            dist/apiary.yaml
            dist/stack-policy.json
          if-no-files-found: error
          retention-days: 1

      - name: Publish the release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          files: |
            dist/compose.yaml
            dist/env.example
            dist/apiary.yaml

  # The release's template, to the public S3 bucket the Launch Stack link reads:
  # apiary/X.Y.Z/apiary.yaml with the stack policy beside it, then apiary/latest/apiary.yaml.
  # The bucket and the AWS role this job assumes, through GitHub's OIDC with no stored key,
  # are the repository variables AWS_TEMPLATE_BUCKET (<bucket>) and AWS_TEMPLATE_ROLE_ARN
  # (arn:aws:iam::<account>:role/<role>). With either unset, the job publishes nothing and
  # says so: the template is then the one attached to the release.
  template:
    name: Publish the AWS template
    needs: [check, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      BUCKET: ${{ vars.AWS_TEMPLATE_BUCKET }}
      ROLE_ARN: ${{ vars.AWS_TEMPLATE_ROLE_ARN }}
    steps:
      - name: Check the bucket and the role are set
        id: target
        run: |
          if [ -n "$BUCKET" ] && [ -n "$ROLE_ARN" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::AWS_TEMPLATE_BUCKET or AWS_TEMPLATE_ROLE_ARN is not set: the template is attached to the release and published to no bucket."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v8
        if: steps.target.outputs.publish == 'true'
        with:
          name: aws-template
          path: dist

      # The credentials are asked for in us-east-1; the AWS CLI follows S3 to the bucket's
      # own region.
      - uses: aws-actions/configure-aws-credentials@v6
        if: steps.target.outputs.publish == 'true'
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: us-east-1

      - name: Upload the template
        if: steps.target.outputs.publish == 'true'
        run: |
          aws s3 cp dist/apiary.yaml "s3://$BUCKET/apiary/$VERSION/apiary.yaml"
          aws s3 cp dist/stack-policy.json "s3://$BUCKET/apiary/$VERSION/stack-policy.json"
          aws s3 cp dist/apiary.yaml "s3://$BUCKET/apiary/latest/apiary.yaml"
