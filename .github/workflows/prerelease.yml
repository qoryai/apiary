name: Pre-release image

# Run by hand only: from the Actions tab, once this file is on the default branch, or by
# pushing a commit to the branch prerelease, which nothing else pushes to. Never on a push
# to any other branch, a pull request or a schedule. Each run costs Actions minutes and
# package storage.
on:
  push:
    branches: [prerelease]
  workflow_dispatch:
    inputs:
      ref:
        description: "The branch, tag or commit to build. Empty: the branch the workflow is run on."
        required: false
        default: ""
        type: string

permissions:
  contents: read

# Two runs for the same ref do not tag at once; neither cancels the other.
concurrency:
  group: prerelease-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

# Builds the image of a commit, as release.yml builds a release's, for linux/amd64 and
# linux/arm64, and publishes it to ghcr.io/qoryai/apiary-prerelease alone, never to
# ghcr.io/qoryai/apiary: as sha-<the commit's first 7 characters>, and as next too when
# the ref built is the branch next. The AWS template's Test image field names such an image
# for a test before a release.
#
# ghcr.io/qoryai/apiary-prerelease stays private for good: it is never made public. It is a
# package of its own because GHCR sets visibility per package, not per tag: a pre-release
# tag in ghcr.io/qoryai/apiary would be as public as that package's releases.
#
# No job deletes old images: old sha- tags are deleted by hand, in the package's settings
# on GitHub.
env:
  IMAGE: ghcr.io/qoryai/apiary-prerelease

jobs:
  resolve:
    name: Resolve the commit
    # Pre-release images are published from the GitHub mirror, as releases are.
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      short: ${{ steps.commit.outputs.short }}
      next: ${{ steps.commit.outputs.next }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      # The commit the ref names now, so both platforms build that same commit even if the
      # branch moves meanwhile.
      - name: Name the commit and its tags
        id: commit
        env:
          REF: ${{ inputs.ref || github.ref }}
        run: |
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short=${sha:0:7}" >> "$GITHUB_OUTPUT"
          case "$REF" in
            next|refs/heads/next) echo "next=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "next=false" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "::notice::Building $REF at $sha"

  # Each platform on a runner of its own architecture, pushed by digest alone, as in
  # release.yml: no tag names an image until both are built.
  image:
    name: Build the image (${{ matrix.platform }})
    needs: resolve
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      # Docker Hub limits the pulls made without a login by address, and GitHub's runners
      # share theirs. What this job still pulls from Docker Hub is pulled as the account in
      # DOCKER_HUB_USERNAME when DOCKER_HUB_TOKEN_SECRET is set. Without them nothing is
      # logged in and the pulls stay anonymous.
      - name: Log in to Docker Hub, when its token is set
        env:
          DOCKER_HUB_USERNAME: ${{ vars.DOCKER_HUB_USERNAME }}
          DOCKER_HUB_TOKEN_SECRET: ${{ secrets.DOCKER_HUB_TOKEN_SECRET }}
        run: |
          if [ -z "$DOCKER_HUB_USERNAME" ] || [ -z "$DOCKER_HUB_TOKEN_SECRET" ]; then
            echo "::notice::DOCKER_HUB_USERNAME or DOCKER_HUB_TOKEN_SECRET is not set: Docker Hub is pulled from without a login."
            exit 0
          fi
          printf '%s' "$DOCKER_HUB_TOKEN_SECRET" | docker login --username "$DOCKER_HUB_USERNAME" --password-stdin

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # release.yml's build: the same build argument, labels and cache, without the version
      # label, as no release names the image.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            APIARY_REVISION=${{ needs.resolve.outputs.sha }}
          labels: |
            org.opencontainers.image.revision=${{ needs.resolve.outputs.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.arch }}

      - name: Keep the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Tag the image
    needs: [resolve, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      SHORT: ${{ needs.resolve.outputs.short }}
      NEXT: ${{ needs.resolve.outputs.next }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One manifest for both platforms, as sha-<7>, and as next when the ref built is next.
      - name: Tag the image
        working-directory: digests
        run: |
          sources=()
          for digest in *; do sources+=("${IMAGE}@sha256:${digest}"); done
          [ "${#sources[@]}" = 2 ] || { echo "expected 2 digests, got ${#sources[@]}" >&2; exit 1; }
          tags=(--tag "${IMAGE}:sha-${SHORT}")
          if [ "$NEXT" = true ]; then tags+=(--tag "${IMAGE}:next"); fi
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          docker buildx imagetools inspect "${IMAGE}:sha-${SHORT}"
          echo "::notice::Published ${IMAGE}:sha-${SHORT}$([ "$NEXT" = true ] && echo " and ${IMAGE}:next")"
